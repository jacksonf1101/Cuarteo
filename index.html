/* ----- campaña ----- */
function stageBarHTML(c){
  const altas = S.ui.view === 'camp' ? alertas(c).filter(a => a.nivel === 'alta').length : 0;
  return STAGES.map((t, i) => { const st = stageStatus(c, i); const on = i === S.ui.stage;
    return `<button class="stg ${st}${on ? ' on' : ''}" data-act="goStage" data-i="${i}"${on ? ' aria-current="step"' : ''}><span class="n">${st === 'done' ? I.check : i + 1}</span><span>${t}</span>${i === 5 && altas ? `<span class="al">${altas}</span>` : ''}</button>`; }).join('');
}
function guideInner(c, i){
  const g = GUIDE[i]; const ch = g.checks(c);
  return `<p>${g.que}</p><h5>Cómo hacerlo</h5><ol>${(typeof g.pasos === 'function' ? g.pasos(c) : g.pasos).map(p => `<li>${p}</li>`).join('')}</ol><h5>Antes de avanzar</h5><ul class="chk">${ch.map(([ok, t]) => `<li class="${ok ? 'ok' : ''}">${ok ? I.check : '<i></i>'}<span>${t}</span></li>`).join('')}</ul>`;
}
function viewCamp(){
  const c = cur(); const i = S.ui.stage; const wide = window.matchMedia('(min-width:1101px)').matches;
  const body = [stPlan, stFuentes, stMuestreo, stClasif, stLab, stResult, stInforme][i](c);
  return `<button class="back" data-act="nav" data-v="panel">${I.chevL} Caracterizaciones</button>
    <div class="ctop"><div id="ringBox">${ring(c, 58)}</div><div style="min-width:0"><h1 class="ctitle" id="campTitle">${esc(c.nombre || 'Estudio sin título')}</h1><div class="cmeta" id="campMeta">${esc(campMeta(c))}</div></div>${Store.mode === 'supa' && S.shareOK && isOwner(c) ? `<div class="acts"><button class="btn ghost sm" data-act="share">${I.share} Compartir</button></div>` : ''}</div>
    ${Store.mode === 'supa' && !isOwner(c) ? `<div class="sharebar">${I.share}<span>Estudio compartido contigo por <b>${esc(personName(c._owner, c._ownerEmail || 'otro usuario'))}</b>${personCargo(c._owner) ? ', ' + esc(personCargo(c._owner)) : ''}. ${readOnly(c) ? 'Solo puedes verlo y descargar sus informes.' : 'Puedes editarlo; los cambios los ven todos los que tienen acceso.'}</span></div>` : ''}
    <nav class="stages" id="stageBar" aria-label="Etapas">${stageBarHTML(c)}</nav>
    <div class="stagewrap"><section class="stage" aria-label="${STAGES[i]}">${body}
      <div class="stnav"><button class="btn ghost" data-act="prev"${i === 0 ? ' disabled' : ''}>${I.chevL} ${i > 0 ? STAGES[i - 1] : 'Anterior'}</button><span class="sp"></span><button class="btn" data-act="next">${i < 6 ? 'Siguiente: ' + STAGES[i + 1] : 'Terminar'} ${I.chevR}</button></div></section>
      <details class="guide"${wide ? ' open' : ''}><summary>${I.book} Guía: ${STAGES[i]}</summary><div id="guideBox">${guideInner(c, i)}</div></details></div>`;
}

function stPlan(c){
  return `<div class="blk"><h3>Identificación del estudio</h3><div class="grid">
    ${fText('Nombre del estudio', 'c.nombre', c.nombre, {full:true, ph:'Ej.: Caracterización RSU, sector norte, época lluviosa'})}
    ${fSel('Tipo de generador', 'c.tipo', c.tipo, TIPOS)}
    ${fText('Entidad o cliente', 'c.entidad', c.entidad, {ph:'Ayuntamiento, empresa, hospital…', hint:'Usa el mismo nombre en estudios futuros para comparar resultados.'})}
    ${fText('Municipio o localidad', 'c.municipio', c.municipio)}
    ${fText('Provincia', 'c.provincia', c.provincia)}
    ${fText('Responsable técnico', 'c.responsable', c.responsable)}
    ${fText('Revisado por', 'c.revisor', c.revisor)}
  </div></div>
  <div class="blk"><h3>Periodo y temporada</h3><div class="grid">
    ${fDate('Inicio del muestreo', 'c.fechaInicio', c.fechaInicio)}${fDate('Fin del muestreo', 'c.fechaFin', c.fechaFin)}
    ${fNum('Días de muestreo', 'c.dias', c.dias, {int:true, unit:'días'})}
    ${fSel('Temporada', 'c.temporada', c.temporada, ['Seca', 'Lluviosa', 'No aplica'])}
  </div></div>
  <div class="blk"><h3>Unidades de medida</h3><p class="note">Elige el sistema en el que capturas y reportas. Los datos se guardan en el sistema métrico y se convierten al mostrarlos, así que puedes cambiar en cualquier momento sin perder precisión. Aplica a toda la app.</p>
    <div class="segs"><button class="seg${SYS() === 'MKS' ? ' on' : ''}" data-act="setUnits" data-v="MKS">Sistema métrico (MKS)</button><button class="seg${SYS() === 'ING' ? ' on' : ''}" data-act="setUnits" data-v="ING">Sistema inglés</button></div></div>
  <div class="blk"><h3>Base de cálculo de la GPC</h3><p class="note">La generación per cápita es lo generado en un día dividido entre la cantidad de la unidad base que atiende cada fuente.</p><div class="grid">
    ${fSel('Unidad base', 'c.unidadBase', c.unidadBase, UNIDADES.map(u => [u[0], cap1(u[0])]), {rerender:true})}
    ${fNum(`Total de ${unidadPlural(c)} del área de estudio`, 'c.poblacion', c.poblacion, {unit:unidadCorta(c), hint:'Se usa para proyectar la generación total en toneladas por día.'})}
  </div></div>
  <div class="blk"><h3>Marco normativo y objetivo</h3><div class="grid">
    ${fArea('Normativa de referencia', 'c.normativa', c.normativa, {full:true, rows:2})}
    ${fArea('Objetivo del estudio', 'c.objetivo', c.objetivo, {full:true, ph:'Determinar la generación per cápita, la composición física y las propiedades de los residuos de…'})}
  </div></div>`;
}

function stFuentes(c){
  const rows = c.fuentes.map(f => { const B = 'f:' + f.id;
    return `<div class="frow"><div class="fhead"><span class="code">${esc(f.codigo)}</span><b data-calc="fhead:${f.id}">${esc(f.nombre) || 'Fuente sin nombre'}</b><span data-calc="fprov:${f.id}"></span><span class="sp"></span>
      <button class="ib" data-act="showQR" data-id="${f.id}" title="Ver etiqueta QR" aria-label="Ver etiqueta QR">${I.qr}</button>
      <button class="ib" data-act="delFuente" data-id="${f.id}" title="Eliminar fuente" aria-label="Eliminar fuente">${I.trash}</button></div>
      <div class="grid">${fText('Nombre', B + '.nombre', f.nombre, {ph:'Sector, departamento, línea…'})}${fSel('Tipo de fuente', B + '.tipo', f.tipo, TIPO_FUENTE)}
      ${fText('Estrato o área', B + '.estrato', f.estrato, {ph:'Estrato bajo, planta 2…'})}${fNum(`${cap1(unidadPlural(c))} que atiende`, B + '.base', f.base, {unit:unidadCorta(c)})}
      ${fSel('Turno habitual', B + '.turno', f.turno, TURNOS)}${fNum('Latitud', B + '.lat', f.lat, {ph:'18.4861'})}${fNum('Longitud', B + '.lng', f.lng, {ph:'-69.9312'})}
      <div class="fld"><label>Ubicación</label><button class="btn ghost" data-act="gpsFuente" data-id="${f.id}">${I.pin} Capturar GPS</button></div></div></div>`; }).join('');
  return `<div class="blk"><h3>Mapa de fuentes</h3><div id="srcMap" class="geomap src" aria-label="Mapa de fuentes generadoras"></div><p class="mapnote" id="srcMapNote"></p></div>
    <div class="blk"><div class="bh"><h3>Fuentes registradas</h3><span class="sp"></span>${c.fuentes.length ? `<button class="btn ghost sm" data-act="qrLabels">${I.qr} Etiquetas QR en PDF</button>` : ''}<button class="btn sm" data-act="addFuente">${I.plus} Agregar fuente</button></div>
    ${rows || emptyMini('Aún no hay fuentes. Agrega la primera: un sector residencial, un departamento o una línea de producción.', 'addFuente', 'Agregar fuente')}</div>`;
}

function stMuestreo(c){
  if (!c.fuentes.length) return emptyMini('Primero registra al menos una fuente generadora.', 'goStage', 'Ir a Fuentes', 'data-i="1"');
  ensureMod(c);
  const mods = `<div class="blk"><h3>Secciones del muestreo</h3><p class="note">Activa las mediciones que harás en este estudio. Cada sección activa aparece en todas las muestras y se incluye en los resultados y en el informe. Si la desactivas, los datos ya capturados se conservan pero no se muestran ni se reportan.</p>
    <div class="mods">${MODS.map(([k, t, d]) => `<label class="mod${modOn(c, k) ? ' on' : ''}"><input type="checkbox" data-bind="c.mod.${k}"${modOn(c, k) ? ' checked' : ''} data-rerender><span><b>${t}</b><small>${d}</small></span></label>`).join('')}</div></div>`;
  return mods + `<div class="blk"><div class="bh"><h3>Muestras</h3><span class="sp"></span><button class="btn ghost sm" data-act="sampleFromQR">${I.scan} Nueva muestra desde QR</button><button class="btn sm" data-act="addSample">${I.plus} Registrar muestra</button></div>
    ${c.muestras.length ? `<div class="slist">${c.muestras.map(m => sampleItem(c, m)).join('')}</div>` : emptyMini('Registra la primera muestra del día. Si las bolsas tienen etiqueta, escanéala para asignar la fuente automáticamente.', 'addSample', 'Registrar muestra')}</div>`;
}
function sampleItem(c, m){
  const open = S.ui.openSample === m.id; const f = fuenteOf(c, m); const B = 'm:' + m.id; const kg = uL('m');
  const head = `<button class="shead" data-act="toggleSample" data-id="${m.id}" aria-expanded="${open}"><span class="mcode">${mLabel(c, m)}</span><span class="st"><b>${esc(f ? `${f.codigo} ${f.nombre || ''}` : 'Sin fuente')}</b><small>Día ${m.dia || '?'}, ${fdate(m.fecha)}, turno ${esc((m.turno || '').toLowerCase())}</small></span><span class="sp"></span><span class="sm" data-calc="mhead:${m.id}"></span>${I.chevR}</button>`;
  if (!open) return `<div class="sitem">${head}</div>`;
  const rondas = (m.cuarteo?.rondas || []).map((r, j) => fWrap(`Después de la ronda ${j + 1}`, `<div class="inp">${numIn(`${B}.cuarteo.rondas.${j}`, r, 'm')}<em>${kg}</em><button class="sc" data-act="scaleTo" data-q="m" data-bind="${B}.cuarteo.rondas.${j}" title="Registrar lectura de la báscula" aria-label="Registrar lectura">${I.dl}</button><button class="sc" data-act="delRonda" data-id="${m.id}" data-j="${j}" title="Quitar ronda" aria-label="Quitar ronda">${I.x}</button></div>`)).join('');
  const thumbs = (m.fotos || []).map(p => `<button class="thumb" data-act="viewPhoto" data-m="${m.id}" data-p="${p.id}" aria-label="Ver foto"><img data-photo="${p.id}" alt=""></button>`).join('');
  return `<div class="sitem open">${head}<div class="sbody">
    <div class="sub"><h4>Origen</h4><div class="grid">
      ${fSel('Fuente', B + '.fuenteId', m.fuenteId, c.fuentes.map(x => [x.id, `${x.codigo} ${x.nombre || ''}`]), {rerender:true})}
      ${fNum('Día de muestreo', B + '.dia', m.dia, {int:true})}${fDate('Fecha', B + '.fecha', m.fecha)}${fSel('Turno', B + '.turno', m.turno, TURNOS)}
      ${fWrap('Código del contenedor', `<div class="inp"><input data-bind="${B}.codigo" value="${esc(m.codigo || '')}" placeholder="Escanea o escribe" autocomplete="off"><button class="sc" data-act="scanInto" data-bind="${B}.codigo" title="Escanear código" aria-label="Escanear código">${I.scan}</button></div>`)}
    </div></div>
    <div class="sub"><h4>Generación</h4><div class="grid">${fNum('Peso generado en la fuente', B + '.pesoGenerado', m.pesoGenerado, {q:'m', scale:true, hint:'Todo lo recolectado de la fuente en el día.'})}</div><div data-calc="gpcm:${m.id}"></div></div>
    <div class="sub"><h4>Cuarteo</h4><div class="cuarteo"><div class="qviz" data-calc="qviz:${m.id}"></div><div><div class="grid">
      ${fNum('Peso inicial del montón', B + '.cuarteo.inicial', m.cuarteo?.inicial, {q:'m', scale:true})}${rondas}
      ${fNum('Peso final de la muestra', B + '.cuarteo.final', m.cuarteo?.final, {q:'m', scale:true, hint:`Objetivo: ${fU('m', S.cfg.pesoMinMuestra, 0)} ${kg} o más.`})}
      <div class="fld"><label>Rondas intermedias</label><button class="btn ghost" data-act="addRonda" data-id="${m.id}">${I.plus} Agregar ronda</button></div>
    </div><div data-calc="cuarteo:${m.id}"></div></div></div></div>
    ${modOn(c, 'dens') ? `<div class="sub"><h4>Densidad</h4><div class="grid">
      ${fNum('Tara del recipiente', B + '.dens.tara', m.dens?.tara, {q:'m', scale:true})}${fNum('Recipiente lleno, sin compactar', B + '.dens.bruto', m.dens?.bruto, {q:'m', scale:true})}
      ${fNum('Volumen del recipiente', B + '.dens.vol', m.dens?.vol, {q:'v'})}${fNum('Volumen ocupado tras compactar', B + '.dens.volComp', m.dens?.volComp, {q:'v'})}
    </div><div data-calc="dens:${m.id}"></div></div>` : ''}
    ${modOn(c, 'hum') ? `<div class="sub"><h4>Humedad</h4><div class="grid">
      ${fNum('Peso húmedo de la submuestra', B + '.hum.humedo', m.hum?.humedo, {q:'g', scale:true})}${fNum(`Peso seco (estufa a ${T105()})`, B + '.hum.seco', m.hum?.seco, {q:'g', scale:true})}
    </div><div data-calc="hum:${m.id}"></div></div>` : ''}
    ${modOn(c, 'ubi') ? `<div class="sub"><h4>Ubicación y evidencia</h4><div class="grid">${fNum('Latitud', B + '.lat', m.lat)}${fNum('Longitud', B + '.lng', m.lng)}
      <div class="fld"><label>Ubicación</label><button class="btn ghost" data-act="gpsSample" data-id="${m.id}">${I.pin} Capturar GPS</button></div></div>
      <div class="thumbs">${thumbs}<button class="thumb add" data-act="addPhoto" data-id="${m.id}">${I.cam}<span>Agregar foto</span></button></div></div>` : ''}
    <div class="sub"><h4>Observaciones</h4><div class="grid">${fArea(null, B + '.obs', m.obs, {full:true, rows:3, ph:'Condiciones del día, incidencias, residuos fuera de lo común…'})}</div></div>
    <div class="sacts"><button class="btn ghost sm" data-act="dupSample" data-id="${m.id}">${I.copy} Siguiente día de esta fuente</button><button class="btn ghost sm danger" data-act="delSample" data-id="${m.id}">${I.trash} Eliminar muestra</button><span class="sp"></span><button class="btn sm" data-act="clasifThis" data-id="${m.id}">Clasificar esta muestra ${I.chevR}</button></div>
  </div></div>`;
}

function stClasif(c){
  if (!c.muestras.length) return emptyMini('Registra primero una muestra en la etapa de muestreo.', 'goStage', 'Ir a Muestreo', 'data-i="2"');
  let mid = S.ui.clasifSample; if (!c.muestras.find(m => m.id === mid)) mid = S.ui.clasifSample = c.muestras[0].id;
  const m = findM(c, mid); const B = 'm:' + m.id; const f = fuenteOf(c, m);
  const chips = c.muestras.map(x => { const fx = fuenteOf(c, x); return `<button class="mchip${x.id === mid ? ' on' : ''}" data-act="pickClasif" data-id="${x.id}"><b>${mLabel(c, x)}</b><small>${esc(fx?.codigo || '')} día ${x.dia || '?'}</small><i data-calc="mchip:${x.id}"></i></button>`; }).join('');
  const row = (k, o = {}) => { const bind = `mc:${m.id}:${k.id}.peso`; const v = m.comp?.[k.id]; const nf = (m.fotos || []).filter(p => p.comp === k.id).length;
    return `<div class="crow${o.sub ? ' sub' : ''}"><i class="cs" style="background:${k.color}"></i><div class="cn"><b>${esc(o.label || k.nombre)}</b><span class="tags" data-calc="tags:${m.id}:${k.id}"></span>${o.extra || ''}</div>
      <div class="cw"><div class="inp">${numIn(bind, v?.peso, 'm', `placeholder="0.000" aria-label="Peso de ${esc(k.nombre)} en ${uL('m')}"`)}<em>${uL('m')}</em><button class="sc" data-act="scaleTo" data-q="m" data-bind="${bind}" title="Registrar lectura de la báscula" aria-label="Registrar lectura de la báscula">${I.dl}</button></div></div>
      <div class="cp" data-calc="pct:${m.id}:${k.id}"></div>
      <button class="cc" data-act="detalle" data-m="${m.id}" data-k="${k.id}" data-calc="code:${m.id}:${k.id}" title="Código y clasificación de este registro"></button>
      ${modOn(c, 'ubi') ? `<button class="ib" data-act="photoComp" data-m="${m.id}" data-k="${k.id}" title="Foto de este componente" aria-label="Foto de este componente">${I.cam}${nf ? `<span class="badge">${nf}</span>` : ''}</button>` : ''}</div>`; };
  const rows = selTops(c).map(k => { const kids = childrenOf(k.id); if (!kids.length) return row(k);
    const exp = isExpanded(c, m, k.id); const nm = esc(k.nombre.toLowerCase());
    const tg = `<button class="lnk${exp ? ' open' : ''}" data-act="toggleGroup" data-m="${m.id}" data-k="${k.id}" aria-expanded="${exp}">${I.chevR}${exp ? `Volver a ${nm} general` : `Detallar por tipo (${kids.length} tipos)`}</button>`;
    if (!exp) return row(k, {extra:tg});
    return `<div class="crow grp"><i class="cs" style="background:${k.color}"></i><div class="cn"><b>${esc(k.nombre)}</b>${tg}</div><div class="cw"><div class="gsum" data-calc="gsum:${m.id}:${k.id}"></div></div><div class="cp" data-calc="gpct:${m.id}:${k.id}"></div></div>`
      + row(k, {sub:true, label:'Sin detallar por tipo'}) + kids.map(x => row(x, {sub:true})).join(''); }).join('');
  return `<div class="bh"><div class="mchips" style="flex:1;min-width:0">${chips}</div><button class="btn ghost sm" data-act="scanClasif">${I.scan} Escanear contenedor</button></div>
    <div class="clhead"><div><h3>${mLabel(c, m)}: ${esc(f ? `${f.codigo} ${f.nombre || ''}` : 'sin fuente')}</h3><p class="note" style="margin:4px 0 0">Día ${m.dia || '?'}, ${fdate(m.fecha)}, turno ${esc((m.turno || '').toLowerCase())}</p></div>
      ${fNum('Peso de la muestra (cuarteo)', B + '.cuarteo.final', m.cuarteo?.final, {q:'m', scale:true})}</div>
    <div data-calc="strip:${m.id}">${stripHTML(weightsOf(m))}</div>
    <div class="bal" data-calc="bal:${m.id}"></div>
    ${compPicker(c)}
    <div class="crows">${rows || '<p class="note" style="padding:14px 0">Este estudio no tiene componentes elegidos. Abre "Componentes de este estudio" y elige los que vas a clasificar.</p>'}</div>
    <p class="hint" style="margin-top:12px">¿Falta un componente? Agrégalo en el <button class="seg" style="padding:0;text-decoration:underline" data-act="nav" data-v="catalogo">catálogo normativo</button> y luego actívalo en "Componentes de este estudio".</p>`;
}

function compPicker(c){
  const tops = topComps(); const sel = selTops(c); const used = usedComps(c); const on = new Set(sel.map(k => k.id));
  const chips = tops.map(k => { const lock = used.has(k.id); const kids = childrenOf(k.id).length;
    return `<button type="button" class="cpk${on.has(k.id) ? ' on' : ''}${lock ? ' lock' : ''}" data-act="toggleComp" data-k="${k.id}" aria-pressed="${on.has(k.id)}" title="${lock ? 'Tiene pesos registrados en este estudio' : on.has(k.id) ? 'Quitar de este estudio' : 'Agregar a este estudio'}"><i style="background:${k.color}"></i>${esc(k.nombre)}${kids ? ` <small>${kids} tipos</small>` : ''}${lock ? ' <small>con pesos</small>' : ''}</button>`; }).join('');
  return `<details class="csel"${S.ui.compPick ? ' open' : ''} data-act="compPickToggle"><summary>${I.chevR}<span>Componentes de este estudio</span><span class="mute" style="font-weight:400">${sel.length} de ${tops.length}</span></summary>
    <p class="hint" style="margin:10px 0 0">Toca un componente para agregarlo o quitarlo. Solo los activos aparecen para pesar. Los que ya tienen pesos en este estudio no se pueden quitar.</p>
    <div class="cpick">${chips}</div>
    <div class="acts" style="margin-top:12px"><button type="button" class="btn ghost sm" data-act="compsAll">Todos</button><button type="button" class="btn ghost sm" data-act="compsNone">Solo los que tienen pesos</button></div></details>`;
}

function stLab(c){
  const cards = c.lab.map((L, n) => { const B = 'l:' + L.id;
    const opts = [['', 'Muestra compuesta'], ...c.muestras.map(m => [m.id, `${mLabel(c, m)} ${fuenteOf(c, m)?.codigo || ''} día ${m.dia || ''}`])];
    const metales = Object.keys(METAL).map(mt => fWrap(`${METAL[mt]} (${mt})`, `<div class="inp"><input data-bind="${B}.metales.${mt}" data-type="num" inputmode="decimal" value="${L.metales?.[mt] ?? ''}" autocomplete="off"><em>mg/L</em></div><div style="margin-top:5px" data-calc="metal:${L.id}:${mt}"></div>`)).join('');
    const cr = Object.entries(CRETIB).map(([k, t]) => fChk(t, `${B}.cretib.${k}`, L.cretib?.[k])).join('');
    return `<div class="sitem open" style="margin-bottom:12px"><div class="shead" style="cursor:default"><span class="mcode">L-${pad2(n + 1)}</span><span class="st"><b>${esc(L.laboratorio || 'Análisis de laboratorio')}</b><small>${fdate(L.fecha)}</small></span><span class="sp"></span><button class="ib" data-act="delLab" data-id="${L.id}" title="Eliminar análisis" aria-label="Eliminar análisis">${I.trash}</button></div><div class="sbody">
      <div class="sub"><h4>Datos del análisis</h4><div class="grid">${fText('Laboratorio', B + '.laboratorio', L.laboratorio)}${fDate('Fecha del análisis', B + '.fecha', L.fecha)}${fText('Referencia del certificado', B + '.referencia', L.referencia)}${fSel('Muestra analizada', B + '.muestraId', L.muestraId || '', opts)}</div></div>
      <div class="sub"><h4>Energía y composición</h4><div class="grid">${fNum('Poder calorífico inferior (PCI)', B + '.pci', L.pci, {q:'e'})}${fNum('Poder calorífico superior', B + '.pcs', L.pcs, {q:'e'})}${fNum('Humedad', B + '.humedad', L.humedad, {unit:'%'})}${fNum('Cenizas', B + '.cenizas', L.cenizas, {unit:'%'})}${fNum('Sólidos volátiles', B + '.volatiles', L.volatiles, {unit:'%'})}${fNum('Relación C/N', B + '.cn', L.cn)}</div><div data-calc="pci:${L.id}"></div></div>

function compTable(R){
  const mx = Math.max(...R.comp.map(x => x.pct), 1);
  return `<table class="tbl"><thead><tr><th>Componente</th><th>Código</th><th class="num">${uL('m')}</th><th class="num">%</th><th style="width:22%"></th></tr></thead><tbody>${R.comp.map(x => `<tr><td><i class="sw" style="background:${x.k.color}"></i>${esc(x.k.nombre)}</td><td style="white-space:nowrap">${esc(codeByRef(x.k.codigo)?.cod || '')}</td><td class="num">${fU('m', x.peso, 2)}</td><td class="num"><b>${fmt(x.pct, 1)}</b></td><td><div class="bar"><i style="width:${x.pct / mx * 100}%;background:${x.k.color}"></i></div></td></tr>`).join('')}</tbody></table>`;
}
function alertList(A){

}

    ${stripHTML(w, {h:30})}<div class="two"><div class="chartbox"><canvas id="chComp" aria-label="Gráfico de composición"></canvas></div><div class="tw">${compTable(R)}</div></div></div>
  ${R.det.map(d => { const w = {}; d.rows.forEach(r => w[r.k.id] = r.peso); const nm = esc(d.k.nombre.toLowerCase());
    return `<div class="blk"><div class="bh"><h3>Desglose de ${nm} por tipo</h3><span class="sp"></span><span class="mute">Detallado en ${d.nDet} de ${d.nGrp} muestras con ${nm}</span></div>${stripHTML(w, {h:22})}
    <div class="tw" style="margin-top:12px"><table class="tbl"><thead><tr><th>Tipo</th><th class="num">${uL('m')}</th><th class="num">% de ${nm}</th><th class="num">% del total</th></tr></thead><tbody>${d.rows.map(r => `<tr><td><i class="sw" style="background:${r.k.color}"></i>${r.sin ? 'Sin detallar por tipo' : esc(r.k.nombre)}</td><td class="num">${fU('m', r.peso, 2)}</td><td class="num"><b>${fmt(r.peso / d.tot * 100, 1)}</b></td><td class="num">${fmt(r.peso / R.total * 100, 2)}</td></tr>`).join('')}</tbody></table></div></div>`; }).join('')}

    <h4 style="margin:18px 0 8px">Aprovechabilidad</h4>${partsStrip(R.grp.aprov, R.total)}
    <h4 style="margin:18px 0 8px">Peligrosidad</h4>${partsStrip(R.grp.pel, R.total)}
    <h4 style="margin:18px 0 8px">Estado físico</h4>${partsStrip(R.grp.estado, R.total)}</div>
  <div class="blk"><h3>Fuentes generadoras</h3>
    <div class="tw"><table class="tbl"><thead><tr><th>Fuente</th><th>Tipo</th><th class="num">Muestras</th><th class="num">Generación promedio</th><th class="num">GPC</th></tr></thead><tbody>${R.porFuente.map(p => `<tr><td><b>${esc(p.f.codigo)}</b> ${esc(p.f.nombre || '')}</td><td>${esc(p.f.tipo || '')}${p.f.estrato ? ', ' + esc(p.f.estrato) : ''}</td><td class="num">${p.n}</td><td class="num">${fU('m', p.genProm, 1)} ${uL('m')}/día</td><td class="num">${fU('m', p.gpc, 3)} ${u}</td></tr>`).join('')}</tbody></table></div>

    <p class="hint">El informe se genera en ${SYSNAME()}. Puedes cambiarlo en Planificación o en Ajustes.</p></div>

function viewCatalogo(){

function catComp(){
  const tops = topComps();
  const rows = orderedComps().map(k => { const B = 'k:' + k.id; const kids = childrenOf(k.id); const sub = !!(k.padre && compById(k.padre));
    const grp = kids.length ? `<span class="hide-m hide-s mute" style="font-size:13px">Grupo con ${kids.length} tipos</span>`
      : `<div class="inp hide-m hide-s"><select data-bind="${B}.padre" data-rerender aria-label="Agrupar en"><option value="">Componente principal</option>${tops.filter(t => t.id !== k.id).map(t => `<option value="${t.id}"${k.padre === t.id ? ' selected' : ''}>Tipo de ${esc(t.nombre.toLowerCase())}</option>`).join('')}</select></div>`;
    return `<div class="krow${sub ? ' sub' : ''}"><input type="color" data-bind="${B}.color" value="${esc(k.color)}" aria-label="Color de ${esc(k.nombre)}">
      <div class="inp kn"><input data-bind="${B}.nombre" value="${esc(k.nombre)}" aria-label="Nombre" autocomplete="off"></div>${grp}
      <div class="inp hide-s"><select data-bind="${B}.nat" aria-label="Naturaleza">${NAT.map(x => `<option${x === k.nat ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="inp hide-s"><select data-bind="${B}.aprov" data-type="bool" aria-label="Aprovechable"><option value="true"${k.aprov ? ' selected' : ''}>Aprovechable</option><option value="false"${!k.aprov ? ' selected' : ''}>No aprovechable</option></select></div>
      <div class="inp hide-m hide-s"><select data-bind="${B}.pel" aria-label="Peligrosidad">${PELIG.map(x => `<option${x === k.pel ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="inp hide-m hide-s"><select data-bind="${B}.estado" aria-label="Estado físico">${ESTADOS.map(x => `<option${x === k.estado ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
      <button class="cc hide-m hide-s" data-act="pickDefCode" data-k="${k.id}"><b>${esc(codeLabel(codeByRef(k.codigo)))}</b><small>Código por defecto</small></button>
      <button class="ib" data-act="delComp" data-k="${k.id}" title="Quitar componente" aria-label="Quitar componente">${I.trash}</button></div>`; }).join('');
  return `<div class="blk" style="border-top:0"><div class="bh"><p class="note" style="margin:0">El color identifica al componente en la franja, los gráficos y el PDF. Con Agrupar en, un componente pasa a ser un tipo dentro de otro: en Clasificación aparece el grupo general y los tipos solo cuando los pides.</p><span class="sp"></span><button class="btn ghost sm" data-act="resetComps">Restaurar predeterminados</button><button class="btn sm" data-act="addComp">${I.plus} Agregar componente</button></div>
    <div class="krow h"><span>Color</span><span>Componente</span><span class="hide-m hide-s">Agrupar en</span><span class="hide-s">Naturaleza</span><span class="hide-s">Aprovechamiento</span><span class="hide-m hide-s">Peligrosidad</span><span class="hide-m hide-s">Estado</span><span class="hide-m hide-s">Código</span><span></span></div>${rows}</div>`;
}
function codeRows(q, sys){

/* ---------- gráficos ---------- */
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mkChart(id, cfg){ const el = document.getElementById(id); if (!el || !window.Chart) return; CH[id] = new Chart(el, cfg); }
function drawCharts(){
  if (!window.Chart) return;
  Chart.defaults.font.family = "'Atkinson Hyperlegible', system-ui, sans-serif"; Chart.defaults.font.size = 13;
  Chart.defaults.color = cssv('--ink-2'); Chart.defaults.borderColor = cssv('--line');
  const pctTick = {callback:v => v + ' %'};
  const v = S.ui.view;
  if (v === 'camp' && S.ui.stage === 5) {
    const c = cur(); const R = calc(c); if (!(R.total > 0)) return;
    mkChart('chComp', {type:'doughnut', data:{labels:R.comp.map(x => x.k.nombre), datasets:[{data:R.comp.map(x => +x.pct.toFixed(2)), backgroundColor:R.comp.map(x => x.k.color), borderColor:cssv('--surface'), borderWidth:2}]},
      options:{maintainAspectRatio:false, cutout:'62%', plugins:{legend:{display:false}, tooltip:{callbacks:{label:t => ` ${t.label}: ${fmt(t.raw, 1)} %`}}}}});
    const pf = R.porFuente.filter(p => p.t > 0);
    if (pf.length) mkChart('chFuente', {type:'bar', data:{labels:pf.map(p => `${p.f.codigo} ${trunc(p.f.nombre, 20)}`), datasets:R.comp.map(x => ({label:x.k.nombre, backgroundColor:x.k.color, data:pf.map(p => +((p.w[x.k.id] || 0) / p.t * 100).toFixed(2))}))},
      options:{indexAxis:'y', maintainAspectRatio:false, scales:{x:{stacked:true, max:100, ticks:pctTick}, y:{stacked:true, grid:{display:false}}}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:t => ` ${t.dataset.label}: ${fmt(t.raw, 1)} %`}}}}});
    const g = S.ui.resTab === 'turno' ? R.porTurno : R.porDia;
    const keys = Object.keys(g).sort((a, b) => S.ui.resTab === 'turno' ? TURNOS.indexOf(a) - TURNOS.indexOf(b) : (+a) - (+b));
    mkChart('chVar', {type:'bar', data:{labels:keys.map(k => S.ui.resTab === 'turno' ? k : 'Día ' + k), datasets:R.comp.map(x => ({label:x.k.nombre, backgroundColor:x.k.color, data:keys.map(k => g[k].t ? +((g[k].w[x.k.id] || 0) / g[k].t * 100).toFixed(2) : 0)}))},
      options:{maintainAspectRatio:false, scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, max:100, ticks:pctTick}}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:t => ` ${t.dataset.label}: ${fmt(t.raw, 1)} %`}}}}});
  }
  if (v === 'panel') {
    const camps = S.campanas.filter(c => !S.ui.histEnt || norm(c.entidad) === S.ui.histEnt).map(c => ({c, R:calc(c)})).filter(x => x.R.total > 0).sort((a, b) => (a.c.fechaInicio || '').localeCompare(b.c.fechaInicio || ''));
    if (!camps.length) return;
    const labels = camps.map(x => `${mesAnio(x.c.fechaInicio)} (${x.c.temporada.toLowerCase()})`);
    const titleCb = {title:items => camps[items[0].dataIndex].c.nombre};
    if (S.ui.histMetric === 'gpc') {
      mkChart('chHist', {type:'bar', data:{labels, datasets:[{label:'GPC', data:camps.map(x => x.R.gpc != null ? +toU('m', x.R.gpc).toFixed(3) : null), backgroundColor:cssv('--leaf'), borderRadius:6, maxBarThickness:60}]},
        options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{...titleCb, label:t => ` GPC ${fmt(t.raw, 3)} ${gpcU(camps[t.dataIndex].c)}`}}}, scales:{y:{beginAtZero:true}}}});
    } else {
      let sets;
      if (S.ui.histMetric === 'frac') sets = [['Orgánico', 'orgPct', CATCOL['Orgánico']], ['Aprovechable', 'aprovPct', CATCOL['Aprovechable']], ['Peligroso', 'pelPct', CATCOL['Peligroso']], ['Manejo especial', 'espPct', CATCOL['Manejo especial']]].map(([l, k, col]) => ({label:l, data:camps.map(x => +x.R[k].toFixed(2)), borderColor:col, backgroundColor:col}));
      else { const avgPct = {}; camps.forEach(x => x.R.comp.forEach(y => avgPct[y.k.id] = (avgPct[y.k.id] || 0) + y.pct));
        const top = Object.entries(avgPct).sort((a, b) => b[1] - a[1]).slice(0, 7).map(([id]) => compById(id)).filter(Boolean);
        sets = top.map(k => ({label:k.nombre, data:camps.map(x => +(x.R.comp.find(y => y.k.id === k.id)?.pct || 0).toFixed(2)), borderColor:k.color, backgroundColor:k.color})); }
      sets.forEach(s => Object.assign(s, {tension:.3, pointRadius:4, pointHoverRadius:6, borderWidth:2.5}));
      mkChart('chHist', {type:'line', data:{labels, datasets:sets}, options:{maintainAspectRatio:false, interaction:{mode:'index', intersect:false}, scales:{y:{beginAtZero:true, ticks:pctTick}}, plugins:{legend:{position:'bottom', labels:{boxWidth:12, usePointStyle:true}}, tooltip:{callbacks:{...titleCb, label:t => ` ${t.dataset.label}: ${fmt(t.raw, 1)} %`}}}}});
    }
    const seasons = ['Seca', 'Lluviosa'].filter(s => camps.some(x => x.c.temporada === s));
    const avgPct = {}; camps.forEach(x => x.R.comp.forEach(y => avgPct[y.k.id] = (avgPct[y.k.id] || 0) + y.pct));
    const top = Object.entries(avgPct).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([id]) => compById(id)).filter(Boolean);
    const sCol = {Seca:'#C98A0B', Lluviosa:'#2E6AAE'};
    mkChart('chSeason', {type:'bar', data:{labels:top.map(k => trunc(k.nombre, 18)), datasets:seasons.map(s => { const cs = camps.filter(x => x.c.temporada === s);
      return {label:s, backgroundColor:sCol[s], borderRadius:4, data:top.map(k => +(avg(cs.map(x => x.R.comp.find(y => y.k.id === k.id)?.pct || 0)) || 0).toFixed(2))}; })},
      options:{maintainAspectRatio:false, scales:{y:{beginAtZero:true, ticks:pctTick}, x:{grid:{display:false}}}, plugins:{legend:{position:'bottom', labels:{boxWidth:12}}, tooltip:{callbacks:{label:t => ` ${t.dataset.label}: ${fmt(t.raw, 1)} %`}}}}});
  }
}

async function importData(d){
  let list = [];
  if (d && d.app === 'cuarteo' && Array.isArray(d.campanas)) { list = d.campanas; if (d.catalogo || d.cfg) { applyConfig(d); scheduleCfg(); } }
  else if (d && d.esquema === 'cuarteo.caracterizacion' && d.datos_cuarteo) list = [d.datos_cuarteo];
  else { toast('El archivo no es un respaldo ni un paquete de Cuarteo.'); return; }
  const fotos = d.fotos && typeof d.fotos === 'object' ? d.fotos : {}; const total = Object.keys(fotos).length; let k = 0, n = 0;
  for (const raw of list) { if (!raw || !Array.isArray(raw.muestras)) continue; const c = {...newCampaign(), ...stripPriv(raw)};
    if (S.campanas.some(x => x.id === c.id)) { c.id = 'c' + uid(); c.nombre = (c.nombre || 'Estudio') + ' (importado)'; }
    S.campanas.push(c);
    for (const m of c.muestras) for (const ph of (m.fotos || [])) { const data = fotos[ph.id]; if (typeof data !== 'string' || !data.startsWith('data:image')) continue;
      try { await Store.putPhoto(ph.id, data, c.id); PHOTO[ph.id] = data; k++; if (k % 5 === 0) toast(`Subiendo fotos: ${k} de ${total}…`); } catch (e) { console.warn(e); } }
    c.muestras.forEach(m => m.fotos = (m.fotos || []).filter(p => PHOTO[p.id] || Store.mode === 'db'));
    scheduleSave(c); n++; }
  toast(n ? `${n} ${n === 1 ? 'estudio importado' : 'estudios importados'}.` : 'No se encontró ningún estudio en el archivo.'); render();
}
function importCodesCSV(text){
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim()); let n = 0;
  for (const line of lines) { const sep = line.includes(';') ? ';' : ','; const p = line.split(sep).map(s => s.trim().replace(/^"|"$/g, ''));
    if (p.length < 3 || /c[oó]digo|descrip/i.test(line) && n === 0 && /sistema/i.test(line)) continue;
    const sis = ['LER', 'EPA', 'Local'].find(s => s.toLowerCase() === p[0].toLowerCase()) || 'Local'; const cod = p[1]; const desc = p[2]; if (!cod || !desc) continue;
    const pel = /^(1|si|sí|true|x|peligroso)$/i.test(p[3] || '') || cod.endsWith('*'); const id = `${sis}|${cod}`;
    const ex = S.catalogo.codigos.find(x => x.id === id); if (ex) Object.assign(ex, {desc, pel}); else S.catalogo.codigos.push({id, sis, cod, desc, pel}); n++; }
  scheduleCfg(); toast(`${n} códigos agregados o actualizados.`); renderMain();
}

  addCode:() => { const n = S.nc; if (!String(n.cod).trim() || !String(n.desc).trim()) { toast('Escribe el código y su descripción.'); return; } const id = `${n.sis}|${n.cod.trim()}`;
    if (S.catalogo.codigos.some(x => x.id === id)) { toast('Ese código ya está en el catálogo.'); return; }
    S.catalogo.codigos.push({id, sis:n.sis, cod:n.cod.trim(), desc:n.desc.trim(), pel:!!n.pel}); S.nc = {sis:n.sis, cod:'', desc:'', pel:false}; scheduleCfg(); renderMain(); toast('Código agregado.'); },
  delCode:el => { S.catalogo.codigos = S.catalogo.codigos.filter(x => x.id !== el.dataset.id); scheduleCfg(); $('#codeTable').innerHTML = codeTableHTML(); },
  importCodes:() => pickFiles('.csv,text/csv,text/plain', false, async f => { try { importCodesCSV(await readText(f[0])); } catch (e) { toast('No se pudo leer el CSV.'); } }),
  resetCfg:() => { S.cfg = clone(DEFAULT_CFG); scheduleCfg(); renderMain(); toast('Valores restaurados.'); },
  pickSys:el => { S.ui.pickSys = el.dataset.s; $('#pickSegs').innerHTML = pickSegs(); $('#codeList').innerHTML = codeListHTML(); },
  pickCodeIt:el => { const fn = S.pick; S.pick = null; if (fn) fn(el.dataset.id); },
  scaleBLE:async () => { try { await Scale.ble(); toast('Báscula conectada.'); } catch (e) { if (e.name !== 'NotFoundError') toast(e.message || 'No se pudo conectar.'); } },
  scaleUART:async () => { try { await Scale.uart(); toast('Báscula conectada.'); } catch (e) { if (e.name !== 'NotFoundError') toast(e.message || 'No se pudo conectar.'); } },
  scaleSerial:async () => { try { await Scale.serial(+($('#baud')?.value || 9600)); toast('Báscula conectada.'); } catch (e) { if (e.name !== 'NotFoundError') toast(e.message || 'No se pudo abrir el puerto.'); } },
  scaleSim:() => { Scale.simulate(); toast('Simulador activo: las lecturas son de prueba.'); if (S.ui.view === 'ajustes') renderMain(); },
  scaleOff:() => { Scale.off(); if (S.ui.view === 'ajustes') renderMain(); },
  tare:() => { if (Scale.kg != null) { Scale.tare = Scale.kg; drawScale(); toast('Tara aplicada.'); } },
  scaleMode:() => { Scale.mode = Scale.mode === 'add' ? 'set' : 'add'; drawScale(); toast(Scale.mode === 'add' ? 'Cada registro se sumará al peso existente.' : 'Cada registro reemplazará el peso existente.'); },
  theme:el => { const v = el.dataset.v; lsSet('cuarteo.theme', v); if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; renderMain(); },
  closeModal:() => closeModal(),
  modalOK:() => { const fn = S.modalOK; S.modalOK = null; closeModal(); if (fn) fn(); }
};
function openContainer(campId, fuenteId, sampleId){
  const c = S.campanas.find(x => x.id === campId); const f = c && c.fuentes.find(x => x.id === fuenteId);
  if (!f) { const hd = hashFicha(); openModal(hd ? `Contenedor ${esc(hd.c)}` : 'Contenedor no encontrado', hd ? `${fichaPreviewHTML(hd)}<p class="hint" style="margin-top:12px">Este contenedor pertenece a un estudio que no está en tu cuenta, así que solo se muestran los datos de la etiqueta.</p>` : '<p>La etiqueta pertenece a un estudio que no está en este espacio de trabajo. Puede haberse eliminado o estar guardado en otra cuenta.</p>', '<button class="btn" data-act="closeModal">Cerrar</button>', 'wide'); return; }
  S.cont = {campId, fuenteId}; const kg = uL('m'); const ms = c.muestras.filter(m => m.fuenteId === f.id); const uu = ubicacionDe(num(f.lat), num(f.lng));
  const rows = ms.map(m => `<tr${m.id === sampleId ? ' class="hl"' : ''}><td><b>${mLabel(c, m)}</b></td><td>Día ${m.dia || '?'}</td><td>${fdate(m.fecha)}</td><td class="num">${fU('m', num(m.pesoGenerado), 1)}</td><td class="num">${fU('m', num(m.cuarteo?.final), 1)}</td><td>${sampleCompTotal(m) > 0 ? '<span class="chip ok">clasificada</span>' : '<span class="chip">pendiente</span>'}</td></tr>`).join('');
  openModal(`Contenedor ${esc(f.codigo)}`, `<div class="cbox"><div class="ccode">${esc(f.codigo)}</div><div><h3>${esc(f.nombre || 'Fuente sin nombre')}</h3><p class="note" style="margin:2px 0 0">${esc([f.tipo, f.estrato, f.turno ? 'turno ' + f.turno.toLowerCase() : ''].filter(Boolean).join(', '))}</p></div></div>
    <dl class="cfacts"><div><dt>Estudio</dt><dd>${esc(c.nombre || 'Estudio sin título')}</dd></div><div><dt>Entidad</dt><dd>${esc(c.entidad || '—')}</dd></div><div><dt>${cap1(unidadPlural(c))} que atiende</dt><dd>${fmt(num(f.base), 0)}</dd></div>
    <div><dt>Ubicación</dt><dd>${num(f.lat) != null ? `${num(f.lat).toFixed(5)}, ${num(f.lng).toFixed(5)}${uu ? '<br>' + esc(ubiTxt(uu)) : ''}` : 'Sin coordenadas'}</dd></div></dl>
    <h4 style="margin:18px 0 6px">Muestras de este contenedor</h4>${ms.length ? `<div class="tw"><table class="tbl"><thead><tr><th>Muestra</th><th>Día</th><th>Fecha</th><th class="num">Generado (${kg})</th><th class="num">Muestra (${kg})</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="note">Todavía no hay muestras de este contenedor.</p>'}`,
    `<button class="btn ghost" data-act="contMap"${num(f.lat) == null ? ' disabled' : ''}>${I.map} Ver en mapa</button><span class="sp"></span><button class="btn ghost" data-act="contOpen">Abrir estudio</button>${ms.length ? '<button class="btn ghost" data-act="contClasif">Clasificar</button>' : ''}<button class="btn" data-act="contNew">${I.plus} Registrar muestra</button>`, 'wide');
}
function checkLink(){
  if (Store.mode === 'login' || Store.mode === 'setup') return;
  let src = ''; try { src = ((location.hash && location.hash.length > 1) ? location.hash : BOOT_HASH) + ' ' + (location.search || ''); } catch (e) {}
  const q = parseQR(src); if (!q) return;
  openContainer(q.camp, q.fuente);
  try { history.replaceState(null, '', location.pathname + location.search.replace(/[?&]cuarteo=[^&]*/, '')); } catch (e) {}
}
function openDetalle(mId, kId){
  const c = cur(); const m = findM(c, mId); const k = compById(kId); const v = (m.comp[kId] = m.comp[kId] || {}); const a = entryAttr(k, v); const B = `mc:${mId}:${kId}`;
  openModal(`${esc(k.nombre)} en ${mLabel(c, m)}`, `<div class="grid">
    <div class="fld full"><label>Código normativo</label><button class="btn ghost wide" data-act="pickEntryCode" data-m="${mId}" data-k="${kId}">${esc(codeLabel(a.code))}${a.code ? `: ${esc(trunc(a.code.desc, 60))}` : ''}</button><p class="hint">Por defecto: ${esc(codeLabel(codeByRef(k.codigo)))}</p></div>
    ${fSel('Estado físico', B + '.estado', v.estado || '', [['', `Por defecto (${k.estado})`], ...ESTADOS])}
    ${fSel('Peligrosidad', B + '.pel', v.pel || '', [['', `Por defecto (${k.pel})`], ...PELIG], {hint:'Si eliges un código con asterisco, el registro se marca como peligroso.'})}
    ${fText('Nota del registro', B + '.nota', v.nota, {full:true, ph:'Ej.: envases con restos de pintura'})}</div>`, `<button class="btn" data-act="closeModal">Listo</button>`);
}
function addPhotos(mId, kId){
  const c = cur(); const m = findM(c, mId);
  pickFiles('image/*', true, async files => { toast('Guardando fotos…'); let n = 0;
    for (const f of files) { try { const d = await compress(f); const id = 'p' + uid(); await Store.putPhoto(id, d, c.id); PHOTO[id] = d; (m.fotos = m.fotos || []).push({id, comp:kId || null}); n++; } catch (e) { toast(e.message || 'No se pudo guardar una foto.'); } }
    if (n) { scheduleSave(c); renderMain(); toast(`${n} ${n === 1 ? 'foto guardada' : 'fotos guardadas'}.`); } });
}
async function aiDraft(){
  const c = cur(); const s = await cap('sample'); if (!s) { toast('La redacción asistida no está disponible en esta vista.'); return; }
  const R = calc(c), A = alertas(c, R); const btn = document.querySelector('[data-act="aiConcl"]'); if (btn) { btn.disabled = true; btn.innerHTML = I.spark + ' Redactando…'; }
  const resumen = {estudio:{nombre:c.nombre, tipo_generador:c.tipo, entidad:c.entidad, municipio:c.municipio, temporada:c.temporada, dias:c.dias, normativa:c.normativa, objetivo:c.objetivo},
    fuentes:R.porFuente.map(p => ({fuente:`${p.f.codigo} ${p.f.nombre}`, estrato:p.f.estrato, gpc:rnd(p.gpc, 3)})), muestras:c.muestras.length,
    indicadores:{gpc:rnd(R.gpc, 3), unidad_gpc:`kg/${unidadCorta(c)}/día`, generacion_proyectada_t_dia:rnd(R.genProy, 2), densidad_suelta_kg_m3:rnd(R.ds, 0), densidad_compactada_kg_m3:rnd(R.dc, 0), humedad_pct:rnd(R.hum, 1), organico_pct:rnd(R.orgPct, 1), aprovechable_pct:rnd(R.aprovPct, 1), peligroso_pct:rnd(R.pelPct, 1), manejo_especial_pct:rnd(R.espPct, 1)},
    composicion:R.comp.map(x => ({componente:x.k.nombre, pct:rnd(x.pct, 1)})), laboratorio:c.lab.map(L => ({pci_kcal_kg:num(L.pci), ph:num(L.ph), humedad_pct:num(L.humedad), metales_tclp_mg_l:L.metales})), alertas:A.map(a => a.titulo)};
  const prompt = `Eres especialista en gestión integral de residuos sólidos. Redacta, en español formal e institucional, las conclusiones y recomendaciones de un informe técnico de caracterización de residuos. Usa solo los datos del resumen: no inventes cifras, normas ni artículos que no aparezcan. Las conclusiones deben tener entre 2 y 4 párrafos que interpreten la generación per cápita, la composición, el potencial de aprovechamiento, la peligrosidad y las alertas. Las recomendaciones deben ser de 3 a 6 acciones concretas, con responsable sugerido y plazo.\n\nResponde solo con JSON con esta forma: {"conclusiones":"párrafo 1\\n\\npárrafo 2","recomendaciones":[{"accion":"...","responsable":"...","plazo":"..."}]}\n\nResumen:\n${JSON.stringify(resumen)}`;
  try {
    const o = await s.json(prompt, {modelTier:'default'});
    if (typeof o?.conclusiones === 'string') c.conclusiones = o.conclusiones.trim();
    if (Array.isArray(o?.recomendaciones)) c.recomendaciones = o.recomendaciones.filter(r => r && r.accion).slice(0, 8).map(r => ({id:'r' + uid(), accion:String(r.accion), responsable:String(r.responsable || ''), plazo:String(r.plazo || '')}));
    scheduleSave(c); renderMain(); toast('Borrador listo. Revísalo y ajústalo antes de emitir el informe.');
  } catch (e) {
    const code = e && e.code; if (code === 'not_granted') S.ai = false;
    toast(code === 'rate_limited' ? 'Hay muchas solicitudes en curso. Inténtalo en un momento.' : code === 'not_granted' ? 'La redacción asistida no está disponible en esta vista.' : code === 'cancelled' ? 'Redacción cancelada.' : 'No se pudo redactar el borrador. Inténtalo de nuevo.');
    renderMain();
  }
}

/* ---------- eventos ---------- */
const RO_OK = new Set(['nav', 'goStage', 'prev', 'next', 'ui', 'toggleSample', 'pickClasif', 'expPDF', 'expXLSX', 'expCSV', 'expJSON', 'showQR', 'qrLabels', 'viewPhoto', 'closeModal', 'compPickToggle', 'openCamp', 'dupCamp', 'scanGlobal', 'scanClasif', 'reloadCloud', 'modalOK', 'contMap', 'contOpen', 'showPriv', 'logout', 'theme', 'setUnits', 'tare', 'scaleMode', 'scaleOff']);
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; if (a.tagName === 'DETAILS' && !e.target.closest('summary')) return;
  if (S.ui.view === 'camp' && readOnly(cur()) && !RO_OK.has(a.dataset.act) && !a.closest('#modal .mh')) { e.preventDefault(); toast('Este estudio es de solo lectura.'); return; } const fn = ACT[a.dataset.act]; if (fn) { e.preventDefault(); fn(a, e); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'codeSearch') { $('#codeList').innerHTML = codeListHTML(); return; }
  if (el.dataset && el.dataset.grole) { const [g, u2] = el.dataset.grole.split('|'); rpcCall('cambiar_rol', {p_grupo:g, p_user:u2, p_rol:el.value}, 'Rol actualizado.'); return; }
  if (el.dataset && el.dataset.acperm) { const a = S.accesos.find(x => x.id === el.dataset.acperm); if (!a) return; rpcCall('compartir_estudio', {p_id:a.campana_id, p_email:a.user_id ? a.email : null, p_grupo:a.grupo_id || null, p_permiso:el.value}, 'Permiso actualizado.'); return; }
  if (el.id === 'gLat' || el.id === 'gLng') { const a = num($('#gLat').value), b = num($('#gLng').value); if (a != null && b != null) setGeo(a, b, null, {typed:true}); return; }
  if (el.id === 'codeFilter') { $('#codeTable').innerHTML = codeTableHTML(); return; }
  if (el.dataset && el.dataset.ui) { S.ui[el.dataset.ui] = el.value; renderMain(); return; }
  if (el.dataset && el.dataset.bind && el.tagName !== 'BUTTON') applyBind(el);
});
$('#modal').addEventListener('close', () => { if (S.consentPending) { S.consentPending = false; setTimeout(() => ACT.logout(), 0); }
  if (S.profilePending) { S.profilePending = false; setTimeout(() => { ACT.logout(); toast('Completa tu perfil para usar Cuarteo.'); }, 0); }
  S.pick = null; if (GEOMAP) { GEOMAP.remove(); GEOMAP = null; } S.geo = null; if (S.ui.view === 'camp' && S.ui.stage === 3) live(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.mode === 'supa' && Date.now() - (Store.loadedAt || 0) > 60000 && !$('#modal').open) reloadCloud(true); });
let rzT = null; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const d = document.querySelector('details.guide'); if (d) d.open = window.matchMedia('(min-width:1101px)').matches || d.open; }, 200); });
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.ready) renderMain(); });

/* ---------- arranque ---------- */
(function boot(){
  const th = lsGet('cuarteo.theme'); if (th) document.documentElement.dataset.theme = th;
  renderShell(); renderMain();
  Store.init().catch(e => console.warn(e)).finally(async () => {
    loadBrand(); await prepLogo();
    S.ready = true; render(); if (S.migrated && Store.mode !== 'login' && Store.mode !== 'setup') { S.migrated = false; scheduleCfg(); }
    postLoginChecks(); window.addEventListener('hashchange', () => { if (Store.mode === 'login') renderMain(); else checkLink(); });
    setTimeout(() => tilesOK(), 800);
    setTimeout(() => loadLib('qr').catch(() => {}), 1500);
    cap('sample').then(s => { S.ai = !!s; if (S.ai && S.ui.view === 'camp' && S.ui.stage === 6) renderMain(); });
  });
})();
