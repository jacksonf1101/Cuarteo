:root{
  --paper:#F1F5EF;--surface:#FFFFFF;--sunk:#E6ECE3;--ink:#14302A;--ink-2:#4B605A;--ink-3:#7B8C86;--line:#D2DBD0;--line-2:#BCC8B9;
  --leaf:#1E7A57;--leaf-ink:#FFFFFF;--leaf-2:#145C41;--leaf-soft:#DBEEE2;
  --amber:#A86F00;--amber-soft:#FAEFD2;--red:#C23A3A;--red-soft:#F8E0DE;--blue:#2E6AAE;--blue-soft:#DEE9F6;
  --f-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-b:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r1:6px;--r2:10px;--r3:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1916;--surface:#15231F;--sunk:#1C2D28;--ink:#E2EDE7;--ink-2:#A6BAB2;--ink-3:#7A8F87;--line:#2A3C36;--line-2:#3B4F48;
    --leaf:#4DBB8C;--leaf-ink:#06130E;--leaf-2:#7DD5AE;--leaf-soft:#18372B;
    --amber:#E5B23E;--amber-soft:#3A2F17;--red:#F07B70;--red-soft:#41201E;--blue:#79A9E0;--blue-soft:#1C2C40;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1916;--surface:#15231F;--sunk:#1C2D28;--ink:#E2EDE7;--ink-2:#A6BAB2;--ink-3:#7A8F87;--line:#2A3C36;--line-2:#3B4F48;
  --leaf:#4DBB8C;--leaf-ink:#06130E;--leaf-2:#7DD5AE;--leaf-soft:#18372B;
  --amber:#E5B23E;--amber-soft:#3A2F17;--red:#F07B70;--red-soft:#41201E;--blue:#79A9E0;--blue-soft:#1C2C40;color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--leaf) 55%,transparent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.mute{color:var(--ink-3)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:22px 16px;border-right:1.5px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink)}
.brand b{display:block;font:800 22px/1 var(--f-d);letter-spacing:-.01em}
.brand small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.2}
.logo{flex:none}
.rail nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:var(--r2);background:none;color:var(--ink-2);font-weight:700;font-size:15px;text-align:left;cursor:pointer}
.nv:hover{background:var(--sunk);color:var(--ink)}
.nv.on{background:var(--leaf-soft);color:var(--ink)}
.nv.on .ic{color:var(--leaf)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2)}
.stat{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--leaf)}.dot.busy{background:var(--amber)}.dot.err{background:var(--red)}
.mainwrap{min-width:0}
main{padding:28px clamp(16px,3.4vw,44px) 64px;max-width:1340px}
.mtop{display:none}
.tabbar{display:none}

/* ---------- typography ---------- */
.disp{font:800 clamp(30px,4.4vw,46px)/1.02 var(--f-d);letter-spacing:-.022em;margin:0 0 10px;font-variation-settings:"opsz" 96}
.lede{margin:0;max-width:62ch;color:var(--ink-2);font-size:17px}
h2,h3,h4{font-family:var(--f-d);margin:0;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
h3{font-size:19px;font-weight:700}
h4{font-size:15.5px;font-weight:700}
.note{color:var(--ink-2);margin:6px 0 14px;max-width:72ch;font-size:15px}
.hint{color:var(--ink-3);font-size:13px;margin:5px 0 0;line-height:1.35}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 17px;border-radius:999px;border:1.5px solid var(--leaf);background:var(--leaf);color:var(--leaf-ink);font:700 15px/1 var(--f-b);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--leaf-2);border-color:var(--leaf-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.danger:hover{background:var(--red-soft)}
.btn.wide{width:100%;justify-content:flex-start}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:38px;height:38px;flex:none;display:inline-grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--ink-2);cursor:pointer;position:relative}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib .badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--leaf);color:var(--leaf-ink);font-size:11px;font-weight:700;line-height:16px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.segs{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--sunk);flex-wrap:wrap}
.seg{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,48,42,.14)}
.segs.big{margin:22px 0 6px}

/* ---------- fields ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 16px}
.fld{min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{display:block;font-weight:700;font-size:13.5px;line-height:1.3;color:var(--ink-2);margin-bottom:6px}
.inp{display:flex;align-items:stretch;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r1);overflow:hidden}
.inp:focus-within{border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px/1.35 var(--f-b);padding:10px 11px;outline:none}
.inp input[data-type]{font-variant-numeric:tabular-nums}
.inp textarea{resize:vertical;min-height:96px}
.inp select{cursor:pointer;padding-right:6px}
.inp em{font-style:normal;color:var(--ink-3);align-self:center;padding:0 10px 0 2px;font-size:14px;white-space:nowrap}
.inp .sc{border:0;border-left:1.5px solid var(--line);background:var(--sunk);color:var(--ink-2);padding:0 11px;cursor:pointer;display:grid;place-items:center}
.inp .sc:hover{color:var(--leaf);background:var(--leaf-soft)}
.inp.inl{display:inline-flex}
.inp input.flash{animation:fl .9s ease}
@keyframes fl{0%{background:var(--leaf-soft)}100%{background:transparent}}
.chkl{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:700;font-size:15px;padding:6px 0}
.chkl input{width:20px;height:20px;accent-color:var(--leaf);margin:1px 0 0;flex:none}

/* ---------- blocks ---------- */
.phead{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
.blk{padding:22px 0;border-top:1.5px solid var(--line)}
.blk:first-child{border-top:0;padding-top:4px}
.blk>h3{margin-bottom:14px}
.bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.two{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start;margin-top:18px}
.chartbox{position:relative;height:280px;min-width:0}
.tw{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:700;font-size:13px;color:var(--ink-3);padding:6px 8px;border-bottom:1.5px solid var(--line-2);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:8px;flex:none}
.bar{height:7px;border-radius:4px;background:var(--sunk);min-width:60px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;font-style:normal;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--leaf-soft);color:var(--leaf-2)}
.chip.pel{background:var(--red-soft);color:var(--red)}
.chip.esp{background:var(--amber-soft);color:var(--amber)}
.chip.org{background:color-mix(in srgb,#7FA02B 20%,transparent);color:color-mix(in srgb,#5B7A14 80%,var(--ink))}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:28px 0;max-width:60ch;color:var(--ink-2)}
.empty p{margin:0;font-size:16px}

/* ---------- the composition strip ---------- */
.strip{display:flex;width:100%;border-radius:9px;overflow:hidden;background:var(--sunk);gap:2px}
.strip i{display:block;min-width:3px;transition:flex-grow .45s cubic-bezier(.2,.7,.2,1)}
.strip.empty{display:grid;place-items:center;background:repeating-linear-gradient(-45deg,var(--sunk) 0 10px,transparent 10px 20px);border:1.5px dashed var(--line-2);color:var(--ink-3);font-size:14px;padding:0 14px;text-align:center}
.minis{height:8px;border-radius:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center}
.legend b{color:var(--ink);margin-left:5px;font-variant-numeric:tabular-nums}

/* ---------- campaign list ---------- */
.clist{display:flex;flex-direction:column}
.camp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 4px;border-bottom:1.5px solid var(--line)}
.camp:first-child{border-top:1.5px solid var(--line)}
.camp .open{display:contents;cursor:pointer}
.camp .t{min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.camp .t b{display:block;font:700 18px/1.25 var(--f-d)}
.camp .t small{display:block;color:var(--ink-2);font-size:14px;margin:3px 0 9px}
.camp .ringbtn{background:none;border:0;padding:0;cursor:pointer}
.camp .side{display:flex;align-items:center;gap:6px}
.camp .facts{display:flex;gap:14px;font-size:13.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.camp .facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.ring{display:block}
.ringt{font:800 11px var(--f-b);fill:var(--ink)}
.ring.big .ringt{font-size:13px}

/* ---------- campaign view ---------- */
.ctop{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-weight:700;font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:10px}
.back:hover{color:var(--leaf)}
.ctitle{font:800 clamp(24px,3vw,34px)/1.08 var(--f-d);letter-spacing:-.018em;margin:0}
.cmeta{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.stages{display:flex;gap:2px;overflow-x:auto;margin:18px 0 0;border-bottom:1.5px solid var(--line);scrollbar-width:thin}
.stg{display:flex;align-items:center;gap:7px;padding:11px 9px 12px;border:0;background:none;color:var(--ink-2);font-weight:700;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;cursor:pointer}
.stg:hover{color:var(--ink)}
.stg .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;background:var(--sunk);color:var(--ink-2);flex:none}
.stg .n .ic{width:14px;height:14px;stroke-width:2.6}
.stg.done .n{background:var(--leaf);color:var(--leaf-ink)}
.stg.part .n{background:var(--amber-soft);color:var(--amber)}
.stg.on{color:var(--ink);border-bottom-color:var(--leaf)}
.stg .al{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px}
.stagewrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:30px;align-items:start;margin-top:22px}
.guide{position:sticky;top:20px;border-left:3px solid var(--leaf);padding:2px 0 4px 18px;font-size:14.5px;color:var(--ink-2)}
.guide summary{list-style:none;font:700 15px var(--f-d);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px}
.guide summary::-webkit-details-marker{display:none}
.guide h5{font:700 13.5px var(--f-b);color:var(--ink);margin:16px 0 6px}
.guide p{margin:8px 0 0}
.guide ol{margin:0;padding-left:20px}
.guide ol li{margin:5px 0}
.guide ul.chk{list-style:none;margin:0;padding:0}
.guide ul.chk li{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.guide ul.chk li i,.guide ul.chk li .ic{width:16px;height:16px;flex:none;margin-top:2px}
.guide ul.chk li i{border:1.5px solid var(--line-2);border-radius:50%}
.guide ul.chk li.ok{color:var(--ink)}
.guide ul.chk li.ok .ic{color:var(--leaf);stroke-width:2.6}
.stnav{display:flex;gap:12px;align-items:center;margin-top:30px;padding-top:20px;border-top:1.5px solid var(--line);flex-wrap:wrap}

/* ---------- fuentes ---------- */
.frow{padding:16px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.fhead{display:flex;align-items:center;gap:8px 10px;margin-bottom:12px;flex-wrap:wrap}
.fhead .chip{white-space:normal}
.code{font:800 13px var(--f-b);padding:3px 9px;border-radius:var(--r1);background:var(--ink);color:var(--paper);letter-spacing:.02em}
.map{width:100%;height:auto;display:block;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r2)}
.map .gl{stroke:var(--line);stroke-width:1}
.map .lbl{font:700 12.5px var(--f-b);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.map .mk{stroke:var(--surface);stroke-width:2.5}
.map .mapnote{font:12px var(--f-b);fill:var(--ink-3)}
.mapempty{display:flex;gap:10px;align-items:center;padding:30px 18px;border:1.5px dashed var(--line-2);border-radius:var(--r2);color:var(--ink-3)}

/* ---------- muestras ---------- */
.slist{display:flex;flex-direction:column;gap:8px}
.sitem{border:1.5px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden}
.sitem.open{border-color:var(--line-2)}
.shead{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer}
.shead>.ic{transition:transform .2s;color:var(--ink-3)}
.sitem.open .shead>.ic{transform:rotate(90deg)}
.mcode{font:800 13px var(--f-b);padding:4px 8px;border-radius:var(--r1);background:var(--leaf-soft);color:var(--leaf-2);flex:none}
.shead .st b{display:block;font-weight:700}
.shead .st small{display:block;color:var(--ink-3);font-size:13px}
.shead .sm{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sbody{padding:4px 16px 16px;border-top:1px solid var(--line)}
.sub{padding:16px 0;border-bottom:1px dashed var(--line)}
.sub:last-of-type{border-bottom:0}
.sub>h4{margin-bottom:12px}
.outs{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:12px}
.outs div{display:flex;flex-direction:column}
.outs span{font-size:13px;color:var(--ink-3)}
.outs b{font:800 22px/1.15 var(--f-d);font-variant-numeric:tabular-nums}
.outs b small{font:600 13px var(--f-b);color:var(--ink-2);margin-left:4px}
.outs .warn b{color:var(--amber)}
.outs .bad b{color:var(--red)}
.cuarteo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start}
.qviz svg{display:block}
.sacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:14px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumb{width:92px;height:92px;border-radius:var(--r2);border:1.5px solid var(--line);background:var(--sunk);padding:0;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{border-style:dashed;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700}

/* ---------- clasificación ---------- */
.mchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.mchip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:var(--r2);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex:none;position:relative;min-width:84px}
.mchip b{font-size:14px}
.mchip small{font-size:12px;color:var(--ink-3)}
.mchip i{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.mchip i.ok{background:var(--leaf)}
.mchip.on{border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.clhead{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:end;margin:18px 0 10px}
.bal{display:flex;flex-wrap:wrap;gap:6px 22px;margin:10px 0 4px;font-size:14px;color:var(--ink-2)}
.bal b{color:var(--ink);font-variant-numeric:tabular-nums}
.bal .ok{color:var(--leaf)}.bal .warn{color:var(--amber)}
.crows{margin-top:10px}
.crow{display:grid;grid-template-columns:6px minmax(150px,1.3fr) 190px 62px minmax(110px,.8fr) 38px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .cs{align-self:stretch;border-radius:3px}
.crow .cn b{display:block;font-weight:700;line-height:1.25}
.crow .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.crow .tags .chip{font-size:11.5px;padding:1px 7px}
.crow .cp{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.cc{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:5px 9px;cursor:pointer;text-align:left;min-width:0}
.cc b{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cc small{font-size:12px;color:var(--ink-3)}
.cc:hover{border-color:var(--leaf)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1.5px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden;margin-bottom:8px}
.kpi{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi span{display:block;font-size:13px;color:var(--ink-2);font-weight:700}
.kpi b{display:block;font:800 27px/1.1 var(--f-d);font-variant-numeric:tabular-nums;margin:4px 0 0;letter-spacing:-.01em}
.kpi small{color:var(--ink-3);font-size:12.5px}
.alerts{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.alert b{display:block}
.alert p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.okline{display:flex;gap:10px;align-items:center;color:var(--leaf-2);font-weight:700;padding:8px 0}

/* ---------- informe ---------- */
.toc{list-style:none;margin:0;padding:0;columns:2 260px;column-gap:28px}
.toc li{display:flex;gap:8px;align-items:center;padding:5px 0;break-inside:avoid;font-size:14.5px}
.toc li .ic{color:var(--leaf);stroke-width:2.4}
.toc li.no{color:var(--ink-3)}
.toc li.no i{width:18px;height:18px;border:1.5px dashed var(--line-2);border-radius:50%;flex:none}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,110px) 38px;gap:10px;align-items:end}
.exports{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.exp{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px solid var(--line-2);border-radius:var(--r2);background:var(--surface);cursor:pointer;text-align:left}
.exp:hover{border-color:var(--leaf);background:var(--leaf-soft)}
.exp .ic{width:28px;height:28px;color:var(--leaf)}
.exp b{display:block;font-size:16px}
.exp small{display:block;color:var(--ink-2);font-size:13px;line-height:1.3;margin-top:2px}
.exp.main{border-color:var(--leaf);border-width:2px}

/* ---------- catálogo ---------- */
.krow{display:grid;grid-template-columns:44px minmax(150px,1.3fr) 150px 120px 140px 130px 100px 120px 38px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.krow.h{font-weight:700;font-size:13px;color:var(--ink-3);border-bottom:1.5px solid var(--line-2)}
.krow input[type=color]{width:40px;height:38px;border:1.5px solid var(--line-2);border-radius:var(--r1);background:var(--surface);padding:2px;cursor:pointer}
.krow .inp input,.krow .inp select{padding:8px 9px;font-size:15px}
.codelist{max-height:min(52vh,460px);overflow:auto;margin-top:12px;border-top:1px solid var(--line)}
.codeit{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 12px;align-items:start;width:100%;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.codeit:hover{background:var(--sunk)}
.codeit b{font-variant-numeric:tabular-nums}
.codeit small{grid-column:1;color:var(--ink-3);font-size:12px}
.codeit span{grid-row:1/3;grid-column:2}
.ctable td:first-child{white-space:nowrap;font-weight:700}

/* ---------- ajustes / báscula ---------- */
.sread{display:flex;flex-direction:column;padding:16px 18px;border-radius:var(--r2);background:var(--ink);color:var(--paper);margin-bottom:14px;max-width:420px}
.sread b{font:800 34px/1.05 var(--f-d);font-variant-numeric:tabular-nums}
.sread span{font-size:14px;opacity:.85;margin-top:4px}
.sread.off{background:var(--sunk);color:var(--ink-2)}
.sread.off b{font-size:22px}
.small{font-size:14px;color:var(--ink-2);padding-left:20px}
.small li{margin:4px 0}
.schema{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sunk);border-radius:var(--r2);padding:14px 16px;overflow-x:auto;color:var(--ink-2);max-width:100%}

/* ---------- floating ---------- */
.scalechip{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 6px 20px rgba(0,0,0,.22)}
.scalechip[hidden]{display:none}
.scalechip b{font:800 18px var(--f-d);font-variant-numeric:tabular-nums}
.scalechip small{font-size:12px;opacity:.8}
.scalechip button{border:0;background:color-mix(in srgb,var(--paper) 16%,transparent);color:var(--paper);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer}
.scalechip .dot{background:var(--amber)}
.scalechip .dot.ok{background:#4DBB8C}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;max-width:min(92vw,520px);padding:12px 18px;border-radius:var(--r2);background:var(--ink);color:var(--paper);font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:var(--r3);padding:0;width:min(640px,94vw);max-height:90vh;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,24,20,.5)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.mh h3{flex:1}
.mb{padding:4px 18px 18px;overflow:auto;max-height:calc(90vh - 140px)}
.mf{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line)}
.qrbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.qrbox svg{border-radius:var(--r2);border:1.5px solid var(--line)}
.bigphoto{width:100%;border-radius:var(--r2);display:block}
.loading{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:60px 0;color:var(--ink-2)}
.loading .logo{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- grupos de componentes ---------- */
.crow.grp .gsum{display:flex;align-items:baseline;gap:6px;padding:9px 11px;border:1.5px dashed var(--line-2);border-radius:var(--r1);font-variant-numeric:tabular-nums}
.crow.grp .gsum b{font-size:16px}
.crow.grp .gsum small{color:var(--ink-3);font-size:13px}
.crow.sub{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.crow.sub .cn{padding-left:18px;position:relative}
.crow.sub .cn::before{content:"";position:absolute;left:3px;top:-10px;height:calc(50% + 10px);width:10px;border-left:1.5px solid var(--line-2);border-bottom:1.5px solid var(--line-2);border-bottom-left-radius:6px}
.crow.sub .cn b{font-size:15px}
.crow.sub .cs{margin:5px 0}
.lnk{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:2px 0;margin-top:6px;text-align:left;color:var(--leaf);font-weight:700;font-size:13.5px;cursor:pointer}
.lnk .ic{width:15px;height:15px;transition:transform .2s}
.lnk.open .ic{transform:rotate(90deg)}
.lnk:hover{text-decoration:underline}
.krow.sub .kn{margin-left:18px}
/* ---------- mapas ---------- */
.map .sea{fill:color-mix(in srgb,var(--blue) 14%,var(--paper))}
.map .pv{fill:var(--surface);stroke:var(--line-2);stroke-width:1}
.map .hti{fill:var(--sunk);stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 3}
.map .rd{fill:none;stroke:var(--amber);stroke-opacity:.5;stroke-width:1.6}
.map .pvl{font:700 11px var(--f-b);fill:var(--ink-3)}
.map .cty{fill:var(--ink-2)}
.map .ctyl{font:700 11px var(--f-b);fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
dialog.wide{width:min(920px,96vw)}
.geomap{height:min(430px,50vh);min-height:280px;border-radius:var(--r2);border:1.5px solid var(--line);background:color-mix(in srgb,var(--blue) 16%,var(--paper));overflow:hidden;z-index:0}
.geomap.src{height:min(360px,48vh)}
.geomap .g-mun{fill:var(--surface);fill-opacity:1;stroke:var(--line-2);stroke-width:.8}
.geomap .g-mun.on{fill:var(--leaf-soft)}
.geomap.tiles .g-mun{fill:transparent;stroke:var(--leaf);stroke-opacity:.45;stroke-dasharray:4 3}
.geomap.tiles .g-mun.on{fill:var(--leaf);fill-opacity:.07}
.geomap .g-pl{fill:none;stroke:var(--ink-3);stroke-width:1.7;stroke-opacity:.85}
.geomap .g-lake{fill:color-mix(in srgb,var(--blue) 24%,var(--paper));fill-opacity:1;stroke:none}
.g-mlbl{background:none;border:0}
.g-mlbl span{position:absolute;transform:translate(-50%,-50%);font:700 11.5px/1.15 var(--f-b);color:var(--ink-2);white-space:nowrap;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface);pointer-events:none}
.geomap .g-mlbl{display:none}
.geomap[data-zb="hi"] .g-mlbl{display:block}
.geomap[data-zb="hi"] .g-plbl,.geomap[data-zb="hi"] .g-city{display:none}
.geomap[data-zb="lo"] .g-plbl,.geomap[data-zb="lo"] .g-city.minor{display:none}
.leaflet-tooltip.g-srcl{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:none;padding:2px 7px;font:700 12px var(--f-b)}
.leaflet-tooltip.g-srcl::before{display:none}
.mapnote{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.basectl{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.28)}
.basectl button{border:0;background:none;padding:6px 11px;border-radius:999px;font:700 12.5px var(--f-b);color:var(--ink-2);cursor:pointer}
.basectl button.on{background:var(--leaf);color:var(--leaf-ink)}
.geomap.tiles{background:var(--sunk)}
.geomap.sat .g-mun{stroke:#ffffff;stroke-opacity:.85}
.geomap.sat .g-mun.on{fill:#ffffff;fill-opacity:.1}
.geomap.sat .g-pl{stroke:#ffffff}
.steps{margin:8px 0 0;padding-left:22px;color:var(--ink-2);font-size:14.5px}
.steps li{margin:4px 0}
.geomap .g-hti{fill:var(--sunk);fill-opacity:1;stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 3}
.geomap .g-road{fill:none;stroke:var(--amber);stroke-width:1.6;stroke-opacity:.55}
.geomap .g-acc{fill:var(--leaf);fill-opacity:.14;stroke:var(--leaf);stroke-width:1.5}
.geomap .g-other{fill:var(--ink-3);fill-opacity:1;stroke:var(--surface);stroke-width:2}
.g-plbl,.g-city,.g-pin{background:none;border:0}
.g-plbl span{position:absolute;transform:translate(-50%,-50%);font:700 11px/1.1 var(--f-b);color:var(--ink-3);white-space:nowrap;pointer-events:none}
.g-city span{position:absolute;left:-4px;top:-8px;display:flex;align-items:center;gap:5px;white-space:nowrap;font:700 11.5px/16px var(--f-b);color:var(--ink);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface);pointer-events:none}
.g-city span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--surface);flex:none}
/* ---------- V 1.12: marca ---------- */
.brand.col{flex-direction:column;align-items:flex-start;gap:10px}
.lgbrand.col{flex-direction:column;align-items:flex-start;gap:4px}
.blogo{object-fit:contain;background:#fff;padding:6px 10px;border-radius:10px;box-sizing:content-box}
.mtop .blogo{max-width:120px!important}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--leaf);animation:spin 1s linear infinite}
/* ---------- V 1.11: perfiles ---------- */
.pname b{display:block;font-weight:700}
.pname small{display:block;color:var(--ink-3);font-size:12.5px}
.acct small{display:block;color:var(--ink-3);font-size:12.5px}
/* ---------- V 1.10: compartir y grupos ---------- */
.ctop .acts{margin-left:auto}
.sharebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 0;padding:10px 14px;border-radius:var(--r2);background:var(--blue-soft);color:var(--ink);font-size:14.5px}
.sharebar .ic{color:var(--blue)}
.ro .stage input,.ro .stage select,.ro .stage textarea{opacity:.75}
.grp-add{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.shlist td{vertical-align:middle}
/* ---------- V 1.9: inicio de sesión y registro ---------- */
body.noauth .rail,body.noauth .tabbar,body.noauth .scalechip{display:none!important}
body.noauth .app{grid-template-columns:minmax(0,1fr)}
body.noauth main{max-width:680px;margin:0 auto;padding-bottom:40px}
.lgcard{display:flex;align-items:center;gap:14px;width:100%;margin-top:22px;padding:16px 18px;border:1.5px solid var(--line-2);border-radius:var(--r2);background:var(--surface);text-align:left;cursor:pointer;color:var(--ink)}
.lgcard:hover{border-color:var(--leaf);background:var(--leaf-soft)}
.lgcard span{flex:1}
.lgcard b{display:block;font-size:16px}
.lgcard small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.lgcard .ic{color:var(--leaf)}
/* ---------- V 1.8: componentes del estudio y diagnóstico ---------- */
.cpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cpk{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer}
.cpk i{width:12px;height:12px;border-radius:50%;flex:none;opacity:.35}
.cpk.on{border-color:var(--leaf);background:var(--leaf-soft);color:var(--ink)}
.cpk.on i{opacity:1}
.cpk.lock{cursor:default}
.cpk small{font-weight:400;color:var(--ink-3);font-size:12px}
details.csel{margin:16px 0 4px;border:1.5px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:12px 14px}
details.csel summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;font-weight:700}
details.csel summary::-webkit-details-marker{display:none}
details.csel summary .ic{transition:transform .2s;color:var(--ink-3)}
details.csel[open] summary .ic{transform:rotate(90deg)}
.diag{margin:18px 0 0;padding:14px 16px;border-radius:var(--r2);border:1.5px solid var(--line-2);background:var(--surface)}
.diag.bad{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:var(--red-soft)}
.diag.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.diag b{display:block;margin-bottom:4px}
.diag pre{white-space:pre-wrap;word-break:break-all;margin:10px 0 0;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--sunk);padding:10px;border-radius:var(--r1);color:var(--ink-2)}
/* ---------- V 1.7: privacidad ---------- */
.priv h4{margin:16px 0 4px;font-size:15px}
.priv p,.priv li{font-size:14.5px;color:var(--ink-2);margin:4px 0}
.priv ul{margin:4px 0;padding-left:20px}
.lgfoot{margin-top:18px;font-size:13.5px;color:var(--ink-3)}
/* ---------- V 1.6: acceso ---------- */
.login{max-width:520px;padding:24px 0}
.lgbrand{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lgform{display:grid;gap:14px;margin-top:18px}
.acct{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:var(--r2);background:var(--sunk);font-size:13px;color:var(--ink-2);word-break:break-all}
.acct b{color:var(--ink);font-size:13.5px}
.acct .lnk{margin-top:4px}
/* ---------- V 1.3 ---------- */
.vtag{display:inline-block;white-space:nowrap;flex:none;margin-top:6px;font:700 11px/1.5 var(--f-b);padding:0 8px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf-2);letter-spacing:.03em}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mod{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line-2);border-radius:var(--r2);background:var(--surface);cursor:pointer}
.mod input{width:20px;height:20px;accent-color:var(--leaf);margin:2px 0 0;flex:none}
.mod b{display:block;font-size:15.5px}
.mod small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.35;margin-top:3px}
.mod.on{border-color:var(--leaf);background:var(--leaf-soft)}
.cbox{display:flex;gap:14px;align-items:center}
.ccode{font:800 24px var(--f-d);padding:10px 14px;border-radius:var(--r2);background:var(--ink);color:var(--paper);flex:none}
.cfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;margin:16px 0 0}
.cfacts dt{font-size:12.5px;color:var(--ink-3);font-weight:700}
.cfacts dd{margin:2px 0 0;font-size:14.5px}
.tbl tr.hl td{background:var(--leaf-soft)}
.changes{list-style:none;margin:0;padding:0}
.changes li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.changes li b{font:800 15px var(--f-d);color:var(--ink)}
.g-pin span{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50% 50% 50% 0;background:var(--leaf);transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.35);border:3px solid var(--surface)}
.geoinfo{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:10px;font-size:14px;color:var(--ink-2)}
.geoinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
.geoinfo a{color:var(--leaf);font-weight:700}
.geoinfo .ic{width:15px;height:15px;vertical-align:-2px;margin-right:3px}
.leaflet-container{font-family:var(--f-b);background:transparent}
.leaflet-tooltip{font:700 12.5px var(--f-b)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--surface);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-control-attribution,.leaflet-control-scale-line{background:color-mix(in srgb,var(--surface) 82%,transparent)!important;color:var(--ink-2)!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-control-scale-line{border-color:var(--ink-2)!important}

@media (max-width:1100px){
  .stagewrap{grid-template-columns:minmax(0,1fr);gap:10px}
  .guide{position:static;order:-1;border-left:0;border:1.5px solid var(--line);border-radius:var(--r2);padding:12px 14px;background:var(--surface)}
  .two{grid-template-columns:minmax(0,1fr)}
  .two .chartbox{max-width:340px;margin:0 auto;width:100%}
  .krow{grid-template-columns:44px minmax(140px,1fr) 120px 110px 38px}
  .krow .hide-m{display:none}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mtop{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1.5px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:30}
  .mtop b{font:800 20px var(--f-d)}
  .mtop .stat{margin-left:auto;font-size:12.5px;color:var(--ink-2)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1.5px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar .nv{flex:1;flex-direction:column;gap:3px;font-size:12px;padding:7px 4px;text-align:center}
  main{padding:20px 16px 110px}
  .scalechip{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:12px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .crow{grid-template-columns:6px minmax(0,1fr) 150px;grid-template-areas:"s n w" "s t p";row-gap:6px}
  .crow .cs{grid-area:s}.crow .cn{grid-area:n}.crow .cw{grid-area:w}
  .crow .cp{grid-area:p}
  .crow .cc{grid-area:t;justify-self:start}
  .crow .ib{display:none}
  .clhead{grid-template-columns:minmax(0,1fr)}
  .camp{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
  .camp .side{grid-column:1/-1;justify-content:flex-end}
  .rec{grid-template-columns:1fr 1fr;}
  .rec .fld:first-child{grid-column:1/-1}
  .cuarteo{grid-template-columns:1fr}
  .qviz{display:none}
  .stnav .btn{flex:1}
  .mf .sp{display:none}
  .mf .btn{flex:1 1 auto}
  .krow{grid-template-columns:40px minmax(0,1fr) 38px}
  .krow .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

function selTops(c){ const tops = topComps(); if (!Array.isArray(c.compSel)) return tops; const used = usedComps(c); return tops.filter(k => c.compSel.includes(k.id) || used.has(k.id)); }
const codeByRef = ref => ref ? S.catalogo.codigos.find(x => x.id === ref) : null;
const codeLabel = x => x ? `${x.sis} ${x.cod}` : 'Sin código';
const findM = (c, id) => c && c.muestras.find(m => m.id === id);
const fuenteOf = (c, m) => c.fuentes.find(f => f.id === m.fuenteId);
const mLabel = (c, m) => 'M-' + pad2(c.muestras.indexOf(m) + 1);

function newCampaign(){
  return {id:'c' + uid(), nombre:'', tipo:TIPOS[0], entidad:'', municipio:'', provincia:'', responsable:'', revisor:'',
    fechaInicio:today(), fechaFin:'', dias:7, poblacion:null, unidadBase:'habitante', temporada:'Lluviosa',
    normativa:BRAND.normativa || 'Ley 225-20 General de Gestión Integral y Coprocesamiento de Residuos Sólidos y su reglamento (Decreto 320-21), República Dominicana',
    objetivo:'', fuentes:[], muestras:[], lab:[], labNoAplica:false, alertasRevisadas:false, qrImpreso:false,
    conclusiones:'', recomendaciones:[], optFotos:true, optRegistro:true, optLab:true, mod:{dens:false, hum:false, ubi:false},
    stage:0, createdAt:Date.now(), updatedAt:Date.now(), informeAt:null, ejemplo:false};
}
function newSample(c, fuenteId){
  const f = c.fuentes.find(x => x.id === fuenteId) || c.fuentes[0];
  const prev = c.muestras.filter(m => m.fuenteId === f?.id);
  const dia = prev.length ? Math.max(...prev.map(m => m.dia || 0)) + 1 : 1;
  const last = prev[prev.length - 1];
  return {id:'m' + uid(), fuenteId:f?.id || '', dia, fecha: c.fechaInicio ? addDays(c.fechaInicio, dia - 1) : today(), turno:f?.turno || 'Mañana',
    codigo:'', pesoGenerado:null, cuarteo:{inicial:null, rondas:[], final:null},
    dens:{tara:last?.dens?.tara ?? null, bruto:null, vol:last?.dens?.vol ?? null, volComp:null}, hum:{humedo:null, seco:null},
    comp:{}, fotos:[], lat:f?.lat ?? null, lng:f?.lng ?? null, obs:''};
}

/* ---------- cálculos ---------- */
function sampleCompTotal(m){ let t = 0; for (const v of Object.values(m.comp || {})) { const p = num(v.peso); if (p > 0) t += p; } return t; }
function weightsOf(m){ const w = {}; for (const [k, v] of Object.entries(m.comp || {})) { const p = num(v.peso); if (p > 0) w[k] = p; } return w; }
function entryAttr(k, v){
  const code = codeByRef(v?.codigo || k.codigo);
  let pel = v?.pel || k.pel;
  if (!v?.pel && code?.pel && pel === 'No peligroso') pel = 'Peligroso';
  return {code, pel, estado: v?.estado || k.estado || 'Sólido', nat: k.nat, aprov: !!k.aprov};
}
function densOf(m){
  const d = m.dens || {}; const b = num(d.bruto);
  const neto = b != null ? b - (num(d.tara) || 0) : null;
  const ds = neto > 0 && num(d.vol) > 0 ? neto / (num(d.vol) / 1000) : null;
  const dc = neto > 0 && num(d.volComp) > 0 ? neto / (num(d.volComp) / 1000) : null;
  return {neto, ds, dc};
}
function humOf(m){ const a = num(m.hum?.humedo), b = num(m.hum?.seco); return a > 0 && b != null && b >= 0 && b <= a ? (a - b) / a * 100 : null; }

function calc(c){
  const total = {v:0}; const byComp = {}; const grp = {nat:{}, aprov:{}, pel:{}, estado:{}};
  for (const m of c.muestras) for (const [cid, v] of Object.entries(m.comp || {})) {
    const p = num(v.peso); if (!(p > 0)) continue; const k = compById(cid); if (!k) continue;
    const rid = rootId(cid); byComp[rid] = (byComp[rid] || 0) + p; total.v += p;
    const a = entryAttr(k, v);
    grp.nat[a.nat] = (grp.nat[a.nat] || 0) + p;
    const ap = a.aprov ? 'Aprovechable' : 'No aprovechable'; grp.aprov[ap] = (grp.aprov[ap] || 0) + p;
    grp.pel[a.pel] = (grp.pel[a.pel] || 0) + p; grp.estado[a.estado] = (grp.estado[a.estado] || 0) + p;
  }
  const T = total.v;
  const comp = topComps().map(k => ({k, peso:byComp[k.id] || 0, pct: T ? (byComp[k.id] || 0) / T * 100 : 0})).filter(x => x.peso > 0).sort((a, b) => b.peso - a.peso);
  const pctOf = (o, key) => T ? (o[key] || 0) / T * 100 : 0;
  let gen = 0, base = 0;
  for (const m of c.muestras) { const f = fuenteOf(c, m); const g = num(m.pesoGenerado), b = num(f?.base); if (g > 0 && b > 0) { gen += g; base += b; } }
  const gpc = base ? gen / base : null;
  const pob = num(c.poblacion);
  const genProy = gpc != null && pob > 0 ? gpc * pob / 1000 : null;
  const D = c.muestras.map(densOf);
  const porFuente = c.fuentes.map(f => {
    const ms = c.muestras.filter(m => m.fuenteId === f.id); const w = {}; let t = 0;
    ms.forEach(m => { for (const [cid, p] of Object.entries(weightsOf(m))) { const r = rootId(cid); w[r] = (w[r] || 0) + p; t += p; } });
    const gl = ms.map(m => num(m.pesoGenerado)).filter(v => v > 0); const genProm = avg(gl);
    const b = num(f.base);
    return {f, w, t, n:ms.length, genProm, gpc: genProm != null && b > 0 ? genProm / b : null};
  });
  const groupBy = keyFn => {
    const g = {};
    for (const m of c.muestras) { const key = keyFn(m); if (key == null || key === '') continue; const o = g[key] || (g[key] = {w:{}, t:0});
      for (const [cid, p] of Object.entries(weightsOf(m))) { const r = rootId(cid); o.w[r] = (o.w[r] || 0) + p; o.t += p; } }
    return g;
  };
  return {comp, total:T, grp, pctOf, gen, base, gpc, genProy,
    ds:avg(D.map(d => d.ds)), dc:avg(D.map(d => d.dc)), hum:avg(c.muestras.map(humOf)),
    porFuente, porDia:groupBy(m => m.dia ? m.dia : null), porTurno:groupBy(m => m.turno || null), det:desglose(c),
    orgPct:pctOf(grp.nat, 'Orgánico'), aprovPct:pctOf(grp.aprov, 'Aprovechable'), pelPct:pctOf(grp.pel, 'Peligroso'), espPct:pctOf(grp.pel, 'Manejo especial')};
}

function desglose(c){
  return topComps().filter(k => childrenOf(k.id).length).map(k => {
    const kids = childrenOf(k.id); const by = {}; let sin = 0, nDet = 0, nGrp = 0;
    c.muestras.forEach(m => { let any = false, g = 0; const vp = num(m.comp?.[k.id]?.peso) || 0; if (vp > 0) { sin += vp; g += vp; }
      kids.forEach(x => { const v = num(m.comp?.[x.id]?.peso) || 0; if (v > 0) { by[x.id] = (by[x.id] || 0) + v; any = true; g += v; } });
      if (g > 0) nGrp++; if (any) nDet++; });
    const tot = sin + Object.values(by).reduce((a, v) => a + v, 0);
    const rows = kids.filter(x => by[x.id] > 0).map(x => ({k:x, peso:by[x.id]})).sort((a, b) => b.peso - a.peso);
    if (sin > 0) rows.push({k, peso:sin, sin:true});
    return {k, kids, by, sin, tot, nDet, nGrp, rows};
  }).filter(d => Object.keys(d.by).length);
}

function previousCampaign(c){
  const e = norm(c.entidad); if (!e) return null;
  return S.campanas.filter(x => x.id !== c.id && norm(x.entidad) === e && (x.fechaInicio || '') < (c.fechaInicio || ''))
    .sort((a, b) => (b.fechaInicio || '').localeCompare(a.fechaInicio || ''))[0] || null;
}

function alertas(c, R = calc(c)){
  const A = []; const cfg = S.cfg;
  const add = (nivel, titulo, detalle, etapa) => A.push({nivel, titulo, detalle, etapa});
  if (R.total > 0 && R.pelPct > cfg.limPeligroso) add('alta', 'Componentes peligrosos sobre el límite', `${fmt(R.pelPct, 1)} % del peso clasificado es peligroso; el límite configurado es ${fmt(cfg.limPeligroso, 1)} %.`, 3);
  for (const m of c.muestras) {
    const t = sampleCompTotal(m); const lab = mLabel(c, m);
    if (t > 0 && R.pelPct <= cfg.limPeligroso) {
      let p = 0; for (const [cid, v] of Object.entries(m.comp || {})) { const k = compById(cid); if (k && num(v.peso) > 0 && entryAttr(k, v).pel === 'Peligroso') p += num(v.peso); }
      const pp = p / t * 100; if (pp > cfg.limPeligroso) add('media', `${lab}: peligrosos al ${fmt(pp, 1)} %`, 'Esta muestra supera el límite aunque el promedio del estudio no lo haga.', 3);
    }
    const fin = num(m.cuarteo?.final);
    if (t > 0 && fin > 0) { const dev = (t - fin) / fin * 100; if (Math.abs(dev) > cfg.tolBalance) add('media', `Cierre de balance fuera de tolerancia en ${lab}`, `La suma de componentes (${fU('m', t)} ${uL('m')}) difiere ${fmt(dev, 1)} % del peso de la muestra (${fU('m', fin)} ${uL('m')}).`, 3); }
    if (fin > 0 && fin < cfg.pesoMinMuestra) add('baja', `${lab} por debajo del peso de muestra objetivo`, `${fU('m', fin)} ${uL('m')} frente a ${fU('m', cfg.pesoMinMuestra, 0)} ${uL('m')} configurados.`, 2);
  }
  for (const pf of R.porFuente) {
    const ms = c.muestras.filter(m => m.fuenteId === pf.f.id && num(m.pesoGenerado) > 0);
    if (ms.length >= 3) { const mean = avg(ms.map(m => num(m.pesoGenerado)));
      for (const m of ms) { const dev = (num(m.pesoGenerado) - mean) / mean * 100;
        if (Math.abs(dev) > cfg.desvVolumen) add('media', `Volumen atípico en ${pf.f.nombre || pf.f.codigo}, día ${m.dia || '?'}`, `${fU('m', num(m.pesoGenerado))} ${uL('m')}, ${dev > 0 ? '+' : ''}${fmt(dev, 0)} % frente al promedio de la fuente (${fU('m', mean)} ${uL('m')}).`, 2); } }
  }
  const prev = previousCampaign(c);
  if (prev) { const P = calc(prev);
    if (P.gpc && R.gpc) { const dev = (R.gpc - P.gpc) / P.gpc * 100; if (Math.abs(dev) > cfg.desvVolumen) add('media', 'Cambio drástico en la generación', `GPC de ${fU('m', R.gpc, 3)} frente a ${fU('m', P.gpc, 3)} ${gpcU(c)} en "${prev.nombre}" (${dev > 0 ? '+' : ''}${fmt(dev, 0)} %).`, 5); }
    if (P.total > 0 && R.total > 0) for (const x of R.comp) { const pp = P.comp.find(y => y.k.id === x.k.id)?.pct || 0; const d = x.pct - pp;
      if (Math.abs(d) > cfg.desvComposicionPP) add('baja', `${x.k.nombre}: ${d > 0 ? '+' : ''}${fmt(d, 1)} puntos`, `Pasa de ${fmt(pp, 1)} % a ${fmt(x.pct, 1)} % respecto a "${prev.nombre}".`, 5); }
  }
  for (const L of c.lab) { const tag = L.referencia || L.laboratorio || 'análisis';
    const ph = num(L.ph); if (ph != null && (ph <= cfg.phMin || ph >= cfg.phMax)) add('alta', `Corrosividad: pH ${fmt(ph, 1)} en ${tag}`, `El pH está fuera del rango ${cfg.phMin} a ${cfg.phMax}.`, 4);
    const fl = num(L.flash); if (fl != null && fl < cfg.flashMin) add('alta', `Inflamabilidad en ${tag}`, `Punto de inflamación de ${fU('T', fl, 0)} ${uL('T')}, por debajo de ${fU('T', cfg.flashMin, 0)} ${uL('T')}.`, 4);
    for (const [mt, lim] of Object.entries(cfg.tclp)) { const v = num(L.metales?.[mt]); if (v != null && v > lim) add('alta', `${METAL[mt]} sobre el límite TCLP en ${tag}`, `${fmt(v, 3)} mg/L frente a ${fmt(lim, 2)} mg/L.`, 4); }
    const flags = Object.entries(L.cretib || {}).filter(([, v]) => v).map(([k]) => CRETIB[k]);
    if (flags.length) add('alta', `Características de peligrosidad marcadas en ${tag}`, flags.join(', ') + '.', 4);
  }
  const order = {alta:0, media:1, baja:2};
  return A.sort((a, b) => order[a.nivel] - order[b.nivel]);
}

function stageStatus(c, i){ const ch = GUIDE[i].checks(c); const n = ch.filter(x => x[0]).length; return n === ch.length ? 'done' : n > 0 ? 'part' : 'todo'; }

function ring(c, size = 56){
  const n = STAGES.length, cx = size / 2, cy = size / 2, r = size / 2 - 5, seg = 360 / n, gap = 9;
  const P = (a, rr = r) => [cx + rr * Math.cos(a * Math.PI / 180), cy + rr * Math.sin(a * Math.PI / 180)].map(v => v.toFixed(2));
  let s = '', done = 0;
  for (let i = 0; i < n; i++) {
    const st = stageStatus(c, i); if (st === 'done') done++;
    const a0 = -90 + i * seg + gap / 2, a1 = -90 + (i + 1) * seg - gap / 2 - 3;
    const col = st === 'done' ? 'var(--leaf)' : st === 'part' ? 'var(--amber)' : 'var(--line-2)';
    const [x0, y0] = P(a0), [x1, y1] = P(a1), t = P(a1 + 5.5), b1 = P(a1, r + 3.2), b2 = P(a1, r - 3.2);
    s += `<path d="M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="${col}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M${b1[0]} ${b1[1]}L${b2[0]} ${b2[1]}L${t[0]} ${t[1]}z" fill="${col}"/>`;
  }
  return `<svg class="ring${size > 50 ? ' big' : ''}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${done} de ${n} etapas completas">${s}<text x="${cx}" y="${cy + 4}" text-anchor="middle" class="ringt">${done}/${n}</text></svg>`;
}

/* Imagen del mapa vectorial para el PDF (sin conexión) */
function mapImage(c, R, W = 1400, H = 760){

  const hl = new Set(); pts.forEach(p => { const u = ubicacionDe(p.lat, p.lng); if (u) hl.add(u.key); });
  if (b[2] - b[0] < .04 && b[3] - b[1] < .04) GEOX.mun.filter(u => hl.has(u.key)).forEach(u => { b = [Math.min(b[0], u.bb[0]), Math.min(b[1], u.bb[1]), Math.max(b[2], u.bb[2]), Math.max(b[3], u.bb[3])]; });

  g.setLineDash([6, 4]); GEOX.hti.forEach(p => { g.beginPath(); p.forEach(ring); g.fillStyle = '#ECEEEA'; g.fill('evenodd'); g.strokeStyle = '#B8C2BC'; g.lineWidth = 1.5; g.stroke(); }); g.setLineDash([]);

  g.strokeStyle = 'rgba(201,138,11,.6)'; g.lineWidth = 2.4; GEOX.rd.forEach(l => { g.beginPath(); g.moveTo(X(l[0]), Y(l[1])); for (let i = 2; i < l.length; i += 2) g.lineTo(X(l[i]), Y(l[i + 1])); g.stroke(); });
  const halo = (t, x, y, font, col, align = 'center') => { g.font = font; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 6; g.strokeText(t, x, y); g.fillStyle = col; g.fillText(t, x, y); };
  const wdeg = W / (k * s);

  g.font = '600 18px Helvetica, Arial, sans-serif'; g.fillStyle = '#14302A'; g.textAlign = 'left'; g.fillText(`${nice} ${SYS() === 'ING' ? 'mi' : 'km'}`, 30, H - 40);

  g.font = '15px Helvetica, Arial, sans-serif'; g.textAlign = 'right'; g.fillStyle = '#5E6E68'; g.fillText('Límites: ONE. Ciudades y carreteras: Natural Earth.', W - 14, H - 12);
  return cv.toDataURL('image/png');

/* ----- aviso de privacidad ----- */
const PRIV_VERSION = '1.2, octubre de 2026';
function privConf(){ const c = (window.CUARTEO_CONFIG && window.CUARTEO_CONFIG.privacidad) || {};
  const r = String(c.responsable || '').trim(), m = String(c.contacto || '').trim();
  return {resp:/tu nombre/i.test(r) ? '' : r, mail:/tu-correo|ejemplo\.com|CORREO-INSTITUCIONAL/i.test(m) ? '' : m}; }
function privacyHTML(){
  const {resp, mail} = privConf(); const who = resp ? `<b>${esc(resp)}</b>` : 'el administrador de esta instalación de Cuarteo';
  const contact = mail ? `<a href="mailto:${esc(mail)}">${esc(mail)}</a>` : 'el administrador que te dio acceso';
  return `<div class="priv"><p class="hint">Versión ${PRIV_VERSION}</p>
    <h4>Responsable</h4><p>El responsable de los datos personales tratados en esta instalación de Cuarteo es ${who}. Contacto: ${contact}.</p>
    <h4>Qué datos recogemos</h4><ul><li>Datos de tu perfil: nombre, apellido y cargo u ocupación.</li><li>Datos de la cuenta: correo electrónico y contraseña. La contraseña se guarda cifrada y nadie puede leerla.</li><li>Registros técnicos de acceso, como la fecha de registro, la fecha del último inicio de sesión y datos de conexión que generan los servicios de alojamiento.</li><li>La información que tú registras: estudios, fuentes, muestras, coordenadas GPS, resultados de laboratorio, ajustes y fotos.</li><li>Los grupos de trabajo a los que perteneces y los estudios que compartes o que otros comparten contigo.</li></ul>
    <h4>Para qué los usamos</h4><p>Para darte acceso a la aplicación, guardar y sincronizar tus estudios entre equipos, generar tus informes y dar soporte técnico. No los usamos para publicidad ni los vendemos.</p>
    <h4>Dónde se guardan</h4><p>En los servicios de Supabase (base de datos, autenticación y almacenamiento de fotos), cuyos servidores pueden estar fuera de la República Dominicana. El código de la aplicación se publica en GitHub, que no recibe tus datos. Los mapas se cargan desde CARTO y Esri, que solo reciben la zona del mapa que se está viendo.</p>
    <h4>Quién puede verlos</h4><p>Cada usuario ve sus propios estudios y los que otros usuarios o sus grupos de trabajo deciden compartir con él. Cuando compartes un estudio, las personas o los grupos que elijas ven sus datos y fotos; si les das permiso de edición, también pueden modificarlos. Los miembros de un grupo, y las personas con las que compartes un estudio, ven tu nombre, tu apellido y tu cargo. El administrador del proyecto puede acceder a los datos para mantenimiento y soporte, y está obligado a protegerlos. No se comparten con terceros, salvo obligación legal.</p>
    <h4>Las etiquetas QR son públicas</h4><p>Los datos que escribes en una fuente (código, nombre, tipo, estrato o área, población, turno, ubicación, estudio y entidad) viajan dentro de su etiqueta QR y los puede leer cualquiera que la escanee. No incluyas nombres de personas ni direcciones de viviendas.</p>
    <h4>Cuánto tiempo los conservamos</h4><p>Mientras tu cuenta esté activa. Al eliminarla se borran de forma permanente tu cuenta, tus estudios, tus ajustes, tus fotos y tu participación en grupos. Los estudios de otras personas que editaste siguen siendo de sus dueños. Los respaldos que descargues quedan bajo tu control.</p>
    <h4>Tus derechos</h4><p>Conforme a la Ley 172-13 sobre protección de datos personales puedes acceder a tus datos, corregirlos, pedir su eliminación u oponerte a su tratamiento. Desde la app puedes descargar un respaldo con todos tus datos, editarlos y eliminar tu cuenta en Ajustes. Para cualquier otra solicitud escribe a ${contact}.</p>
    <h4>Seguridad</h4><p>Las conexiones van cifradas, las contraseñas se guardan cifradas y las reglas de la base de datos impiden que un usuario vea los datos de otro.</p>
    <h4>Cambios</h4><p>Si este aviso cambia, la aplicación te pedirá que lo aceptes de nuevo.</p></div>`;
}
function profileComplete(p){ return !!(p && String(p.nombre || '').trim() && String(p.apellido || '').trim() && String(p.cargo || '').trim()); }
async function saveProfile(nom, ape, car){
  const me = Store.user.id; const row = {id:me, nombre:nom, apellido:ape, cargo:car, email:Store.user.email || '', updated_at:new Date().toISOString()};
  const {error} = await Store.sb.from('perfiles').upsert(row, {onConflict:'id'}); if (error) throw new Error(error.message);
  try { const r = await Store.sb.auth.updateUser({data:{nombre:nom, apellido:ape, cargo:car}}); if (r.data && r.data.user) Store.user = r.data.user; } catch (e) {}
  S.perfiles[me] = row;
}
function checkProfile(){
  if (Store.mode !== 'supa' || !Store.user || !S.perfilesOK) return false;
  const me = Store.user.id; if (profileComplete(perfilDe(me))) return false;
  const md = Store.user.user_metadata || {};
  if (profileComplete(md)) { saveProfile(md.nombre.trim(), md.apellido.trim(), md.cargo.trim()).then(() => render()).catch(() => {}); return false; }
  askProfile(true); return true;
}

function hashFicha(){

  const q = new URLSearchParams(src.replace(/^#/, '')); if (!q.get('c')) return null;
  const n = k => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : null; };
  return {id:q.get('cuarteo') || '', c:q.get('c'), n:q.get('n') || '', t:q.get('t') || '', s:q.get('s') || '', b:q.get('b') || '', ub:q.get('ub') || 'habitantes', tu:q.get('tu') || '', la:n('la'), lo:n('lo'), m:q.get('m') || '', p:q.get('p') || '', e:q.get('e') || '', en:q.get('en') || ''};
}

const maskKey = t => String(t).replace(/(['"])([A-Za-z0-9_\-.]{24,})\1/g, (m, q, v) => `${q}${v.slice(0, 12)}…${v.slice(-4)}${q}`);
async function diagConfig(){
  if (!/^https?:$/.test(location.protocol)) return {bad:true, title:'Estás abriendo el archivo desde tu computadora', msg:'Así no se puede leer config.js. Abre la dirección de GitHub Pages (https://TU-USUARIO.github.io/TU-REPOSITORIO/).'};
  const url = new URL('config.js', location.href).href; let r, txt = '';
  try { r = await fetch(url + '?v=' + Date.now(), {cache:'no-store'}); txt = r.ok ? await r.text() : ''; } catch (e) { return {bad:true, title:'No se pudo descargar config.js', msg:'Revisa tu conexión a internet y recarga la página.', url}; }
  if (!r.ok) return {bad:true, title:`No se encontró config.js (error ${r.status})`, msg:'La app lo busca en la misma carpeta que index.html. Revisa que el archivo se llame exactamente config.js, en minúsculas y sin .txt al final, y que esté junto a index.html en el repositorio. Si acabas de subirlo, espera uno o dos minutos y recarga con Ctrl + F5.', url};
  if (Store.cfgError || !window.CUARTEO_CONFIG) return {bad:true, title:'config.js tiene un error de escritura', msg:`${Store.cfgError ? 'El navegador dice: ' + Store.cfgError + '. ' : ''}Revisa que cada valor esté entre comillas simples, que haya una coma entre los datos y que todas las llaves { } cierren. Debe empezar con window.CUARTEO_CONFIG = {`, url, txt};
  const c = window.CUARTEO_CONFIG; const u = String(c.supabaseUrl || ''), k = String(c.supabaseAnonKey || '');
  if (!u || !k) return {bad:true, title:'Faltan datos en config.js', msg:`No encontré ${!u ? 'supabaseUrl' : 'supabaseAnonKey'}. Los nombres deben escribirse exactamente así: supabaseUrl y supabaseAnonKey.`, url, txt};
  if (/TU-PROYECTO|PEGA-AQUI/i.test(u + k)) return {bad:true, title:'config.js todavía tiene los valores de ejemplo', msg:'Cambia TU-PROYECTO y PEGA-AQUI-LA-CLAVE-ANON-PUBLIC por tu Project URL y tu clave anon public de Supabase. Edita el archivo en GitHub con el ícono del lápiz y guarda con Commit changes.', url, txt};
  if (/service_role|sb_secret_/i.test(k) || jwtRole(k) === 'service_role') return {bad:true, title:'Pegaste la clave secreta', msg:'Esa clave da acceso total a tu base de datos y no debe estar en GitHub. Cámbiala por la clave anon public o publishable y, por seguridad, genera una nueva clave secreta en Supabase.', url};
  if (!/^https:\/\/[^\s/]+\.supabase\.co\/?$/i.test(u)) return {bad:false, title:'Revisa la Project URL', msg:`La dirección "${u}" no tiene la forma habitual https://xxxx.supabase.co. Si es correcta, ignora este aviso.`, url, txt};
  if (Store.sbError) return {bad:true, title:'config.js está bien, pero Supabase no respondió', msg:`Error: ${Store.sbError}. Revisa que la Project URL y la clave anon public sean del mismo proyecto.`, url};
  return {bad:false, ok:true, title:'config.js está bien', msg:'Recarga la página con Ctrl + F5. Si vuelves a ver esta pantalla, avísame.', url};
}

async function createCamp(groupId){
  const c = newCampaign(); S.campanas.push(c); closeModal();
  if (!groupId) { scheduleSave(c); openCamp(c.id, 0); return; }
  toast('Creando el estudio del grupo…');
  try { S.dirty.add(c.id); await Store.putCampaign(c); S.dirty.delete(c.id); } catch (e) { saveErr(e, () => {}); openCamp(c.id, 0); return; }
  const {error} = await Store.sb.rpc('compartir_estudio', {p_id:c.id, p_email:null, p_grupo:groupId, p_permiso:'editar'});
  if (error) toast('El estudio se creó, pero no se pudo compartir con el grupo: ' + error.message);
  await reloadCloud(true); openCamp(c.id, 0); if (!error) toast(`Estudio creado para el grupo ${grupoNombre(groupId)}.`);
}
